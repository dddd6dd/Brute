<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WOD">
<meta name="mobile-web-app-capable" content="yes">

<title>I AM BRUTE</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="hero-card card">
  <div class="top-pill" id="admin-secret" style="cursor:default; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;"><span class="dot"></span>FOR · JOGYM<span id="app-version" aria-label="버전 v63" style="opacity:.6;">v63</span></div>
  <h1 id="home-title" style="cursor:default; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;">I AM BRUTE</h1>
</div>

<div class="tabs" id="main-tabs">
  <button class="tab-btn active" id="tab-log" title="오늘 운동" aria-label="오늘 운동">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3 9.5v5"/><path d="M21 9.5v5"/><path d="M6.5 12h11"/></svg>
  </button>
  <button class="tab-btn" id="tab-board" title="Progress" aria-label="Progress">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
  </button>
  <button class="tab-btn" id="tab-profile" title="선수 프로필" aria-label="선수 프로필">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.9 3.6-6 8-6s8 2.1 8 6"/></svg>
  </button>
  <button class="tab-btn" id="tab-admin" title="관리자" aria-label="관리자" style="display:none;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  </button>
</div>

<div id="view-log">
  <div id="log-date-box" class="card" style="margin-bottom:16px;">
        <div id="log-date-calendar"></div>
    <p class="muted" id="log-date-hint" style="margin-top:8px; margin-bottom:0;"></p>
  </div>
  <div id="log-form"></div>
</div>

<div id="view-board" class="hidden">
  <div id="board-content"></div>
</div>

<div id="view-profile" class="hidden">
  <div id="profile-list"></div>
  <div id="profile-detail" class="hidden"></div>
  <div id="profile-item-detail" class="hidden"></div>
</div>

<div id="view-admin" class="hidden">
  <div id="admin-gate">
    <p class="muted" style="margin-bottom:12px;">관리자 비밀번호</p>
    <input type="password" id="admin-pw" style="width:100%; margin-bottom:8px;" />
    <button class="primary" id="admin-unlock-btn" style="width:100%;">확인</button>
  </div>
  <div id="admin-panel" class="hidden">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;"><p class="eyebrow" style="margin:0;">ADMIN</p><button type="button" id="adm-exit" style="height:30px; font-size:13px; padding:0 12px;">나가기</button></div>
    <div id="adm-tabs" style="display:flex; gap:4px; padding:4px; margin-bottom:20px; border-radius:999px; background:var(--surface-2); border:0.5px solid var(--border);"><button type="button" class="adm-tab active" data-sec="program" style="flex:1; height:36px; font-size:14px; border-radius:999px; border:none; box-shadow:none; background:var(--surface-1); color:var(--text-primary); font-weight:600;">프로그램</button><button type="button" class="adm-tab" data-sec="video" style="flex:1; height:36px; font-size:14px; border-radius:999px; border:none; box-shadow:none; background:transparent; color:var(--text-secondary); font-weight:400;">동작 영상</button><button type="button" class="adm-tab" data-sec="pin" style="flex:1; height:36px; font-size:14px; border-radius:999px; border:none; box-shadow:none; background:transparent; color:var(--text-secondary); font-weight:400;">PIN 관리</button></div>
    <div id="adm-sec-program">
    <label>날짜</label>
    <input type="date" id="admin-date" style="width:160px; margin-bottom:12px;" />

    <div class="row" style="margin-bottom:8px;">
      <button id="mode-json-btn" class="primary" style="height:32px; font-size:15px;">JSON 붙여넣기</button>
      <button id="mode-ai-btn" style="height:32px; font-size:15px;">AI 자동 추출</button>
    </div>

    <div id="mode-json">
      <p class="muted" style="margin-bottom:8px;">JSON 배열을 붙여넣고 불러오면 아래 편집기에서 다듬을 수 있어요.</p>
      <textarea id="json-text" rows="12" placeholder='[{"section":"...","subsection":"...","name":"...","type":"weight","prescribed":"..."}, ...]'></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="primary" id="json-load-btn">불러와서 편집하기</button>
        <span class="status" id="json-status"></span>
      </div>
      <div class="error-box" id="json-error"></div>
    </div>

    <div id="mode-ai" class="hidden">
      <label>오늘 훈련프로그램 붙여넣기</label>
      <textarea id="program-text" rows="10" placeholder="오늘 훈련프로그램 텍스트를 여기에 붙여넣어주세요"></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="primary" id="parse-btn">항목 자동 추출하기</button>
        <span class="status" id="parse-status"></span>
      </div>
      <div class="error-box" id="parse-error"></div>
    </div>

    <div id="items-editor-wrap" class="hidden">
      <hr style="border:none; border-top:0.5px solid var(--border); margin:24px 0 16px;" />
      <p class="eyebrow" style="margin-bottom:4px;">EDITOR</p>
      <h3 style="font-size:18px; font-weight:500; margin:0 0 4px;">항목 편집</h3>
      <p class="muted" id="editor-date-label" style="margin:0 0 12px;">항목을 눌러서 이름·기록 방식·라운드 수 등을 수정할 수 있어요.</p>
      <div id="items-editor"></div>
      <button id="editor-add-item-btn" style="width:100%; height:38px; font-size:15px; margin-top:6px;">+ 항목 추가</button>
      <div class="row" style="margin-top:16px;">
        <button class="primary" id="editor-publish-btn">게시하기</button>
        <button id="editor-cancel-btn">취소</button>
        <span class="status" id="editor-status"></span>
      </div>
      <div class="error-box" id="editor-error"></div>
    </div>

    <hr style="border:none; border-top:0.5px solid var(--border); margin:24px 0;" />
    <p class="muted" style="margin-bottom:8px;">등록된 프로그램 관리</p>
    <div id="admin-program-list"></div>
    </div>
    <div id="adm-sec-video" class="hidden">
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px;"><p class="muted" style="margin:0;">동작 영상</p><span class="muted" id="mv-count" style="font-size:13px;"></span></div>
    <p class="muted" style="font-size:13px; margin:0 0 10px;">등록한 동작은 운동 화면에서 이름 옆에 유튜브 아이콘이 붙어요.</p>
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><input type="date" id="mv-date" style="width:160px;" /><span class="muted" style="font-size:13px;">이 날 운동에서 동작을 골라요</span></div>
    <div id="mv-picker" style="display:flex; flex-direction:column; gap:10px; margin-bottom:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
      <input type="text" id="mv-name" list="personal-movements" placeholder="동작 이름 (예: Thread the Needle)" />
      <div style="display:flex; gap:8px;"><input type="url" id="mv-url" placeholder="유튜브 링크" style="flex:1; min-width:0;" /><button class="primary" id="mv-add-btn" style="flex-shrink:0;">저장</button></div>
      <span class="status" id="mv-status"></span>
    </div>
    <input type="text" id="mv-search" placeholder="검색" style="width:160px; height:34px; font-size:14px; margin-bottom:4px;" />
    <div id="mv-list"></div>
    </div>
    <div id="adm-sec-pin" class="hidden">
      <p class="muted" style="font-size:13px; margin:0 0 12px;">비공개 프로필 목록이에요. 초기화하면 PIN이 지워지고 공개로 바뀌어요. 기록은 그대로예요. 본인이 다시 비공개를 켜고 새 PIN을 정하면 돼요.</p>
      <div id="adm-pin-list"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/programs.js"></script>
<script src="js/charts.js"></script>
<script src="js/records.js"></script>
<script src="js/pace.js"></script>
<script src="js/progress.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/profile.js"></script>
<script src="js/admin.js"></script>
<script src="js/weight-calculator.js"></script>
<script src="js/supabase.js"></script>
<script src="js/workout-share.js"></script>
<script src="js/app.js"></script>
</body>
</html>
