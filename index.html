function todayStr(){ return new Date().toISOString().slice(0,10); }

// ---------- 가벼운 등장 애니메이션 헬퍼 ----------
// 요소가 나타날 때 살짝 페이드+슬라이드 되도록. 매번 다시 트리거되게 리플로우로 리셋해요.
function reveal(el){
  if(!el) return;
  el.classList.remove('reveal-anim');
  void el.offsetWidth;
  el.classList.add('reveal-anim');
}
// hidden 클래스를 토글하면서, 보여질 때만 reveal 애니메이션을 같이 트리거해요.
function revealToggle(el, show){
  if(!el) return;
  el.classList.toggle('hidden', !show);
  if(show) reveal(el);
}
// 두 컨테이너 중 하나만 보이게 전환하면서, 새로 보이는 쪽에 살짝 페이드인을 줘요.
function fadeSwap(showEl, ...hideEls){
  hideEls.forEach(el=> el && el.classList.add('hidden'));
  if(showEl){
    showEl.classList.remove('hidden');
    showEl.classList.remove('fade-swap');
    void showEl.offsetWidth;
    showEl.classList.add('fade-swap');
  }
}

// 접혔다 펼쳐지는 패널(무게 계산기 등)에 공통으로 쓰는 max-height 트랜지션 초기화/토글.
function initCollapsible(panel){
  panel.style.cssText += 'overflow:hidden; max-height:0; opacity:0; transition: max-height .28s ease, opacity .22s ease;';
}
function toggleCollapsible(panel, opening){
  if(opening){
    panel.classList.add('open');
    panel.style.maxHeight = panel.scrollHeight + 'px';
    panel.style.opacity = '1';
    panel.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'max-height') return;
      if(panel.classList.contains('open')) panel.style.maxHeight = 'none';
      panel.removeEventListener('transitionend', onEnd);
    });
  } else {
    panel.style.maxHeight = panel.scrollHeight + 'px';
    panel.offsetHeight;
    requestAnimationFrame(()=>{
      panel.style.maxHeight = '0';
      panel.style.opacity = '0';
    });
    panel.classList.remove('open');
  }
}

// ---------- 프로그램 문구 표시 ----------
// "1.Warm Up", "A) Warm Up" 같은 앞 번호를 떼고 보여줘요. 섹션과 소분류가 같은 이름이면 소분류는 숨겨요.
function stripLabelPrefix(s){
  return String(s || '').replace(/^\s*(?:\d+|[A-Za-z])\s*[.)]\s*/, '').trim();
}
function isSameLabel(a, b){
  const norm = (s)=> stripLabelPrefix(s).toLowerCase().replace(/\s+/g, '');
  return norm(a) === norm(b);
}
// 기준 설명을 동작마다 한 줄씩 보여줘요. 줄바꿈이 있으면 그대로 쓰고,
// 없으면 괄호 밖의 ", " / ". " / " + " / " → " 와 앞머리 "2 Sets:" 같은 라벨에서 줄을 나눠요.
function splitPrescribedLines(text){
  const src = String(text || '').replace(/\r\n?/g, '\n').replace(/\\n/g, '\n').trim();
  if(!src) return [];
  if(src.includes('\n')) return src.split(/\n/).map(s=>s.trim());
  const lines = [];
  let rest = src;
  const head = rest.match(/^((?:\d+\s*)?(?:sets?|rounds?|each for time|for time)\s*:)\s*/i);
  if(head){ lines.push(head[1]); rest = rest.slice(head[0].length); }
  let buf = '', depth = 0;
  for(let i = 0; i < rest.length; i++){
    const c = rest[i];
    if(c === '(') depth++;
    if(c === ')') depth = Math.max(0, depth - 1);
    if(depth === 0){
      if((c === ',' || c === '.') && rest[i+1] === ' '){ if(c === '.') buf += ''; lines.push(buf); buf = ''; i++; continue; }
      if(c === '+' && rest[i-1] === ' ' && rest[i+1] === ' '){ lines.push(buf); buf = ''; i++; continue; }
      if(c === '→'){ lines.push(buf); buf = '→ '; if(rest[i+1] === ' ') i++; continue; }
    }
    buf += c;
  }
  lines.push(buf);
  return lines.map(s=>s.trim().replace(/\.$/, '')).filter(Boolean);
}
// 줄 종류별 색: 구조(세트·라운드·렙 스킴)=진하게, 동작=보통, 휴식/메모=흐리게, 기록 안내=포인트색
function prescribedLineStyle(l){
  if(/^기록/.test(l)) return 'color:var(--border-accent); font-size:13px; margin-top:4px;';
  if(/^-?\s*rest\b/i.test(l)) return 'color:var(--text-muted); font-size:14px;';
  if(/^\*/.test(l)) return 'color:var(--text-muted); font-size:14px;';
  if(/^(\d+\s*(sets?|rounds?)\b|\d+x\d+|\d+(-\d+)+$|emom|e\d+mom|amrap|for time|each for time|build to|every|then$|rpe\b)/i.test(l))
    return 'color:var(--text-primary); font-weight:500;';
  return 'color:var(--text-secondary);';
}
function formatPrescribed(text){
  return splitPrescribedLines(text)
    .map(l => { if(!l) return '<div style="height:0.6em;"></div>'; const mv = extractMovementName(l); return `<div style="${prescribedLineStyle(l)}"${mv ? ` data-mv="${escapeAttr(mv)}"` : ''}>${escapeHtml(l)}</div>`; })
    .join('');
}

// ---------- 동작 영상: 동작 이름 → 유튜브 링크 (movement_videos 테이블) ----------
const MV_HEADER_RE = /^(\d+\s*(sets?|rounds?)\b|\d+x\d+|\d+(-\d+)+|emom|e\d+mom|amrap|for time|each for time|build to|every|then$|rpe\b|rest\b|min \d|scale|goal|target|time cap|x\d)/i;
function extractMovementName(line){
  let s = String(line || '').trim();
  if(!/[a-z]/i.test(s) || /[가-힣]/.test(s) || /:$/.test(s) || /^[(+\-*]/.test(s) || MV_HEADER_RE.test(s)) return '';
  s = s.replace(/^(:?\d+(:\d+)?(\.\d+)*(\/\d+)?(x|ft|m|cal)?(\/side)?)(\s+(seconds?|secs?)(\/side)?)?\s+/i, '');
  s = s.replace(/\s*@.*$/, '').replace(/\s*\(.*?\)/g, '').replace(/\s*-into-.*$/i, '').trim();
  return (s.length >= 3 && /[a-z]{3}/i.test(s)) ? s : '';
}
const normMv = s => String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).map(w => w.length > 3 ? w.replace(/s$/, '') : w).join('');
let MV_MAP = null;
async function loadMovementVideos(){
  const { data, error } = await sb.from('movement_videos').select('name, url').order('name');
  MV_MAP = new Map();
  if(!error) (data || []).forEach(r => MV_MAP.set(normMv(r.name), r));
  decorateMovementVideos(document);
  return MV_MAP;
}
function findMovementVideo(name, line){
  if(!MV_MAP) return null;
  const k = normMv(name);
  return MV_MAP.get(k) || null;
}
const MV_BTN = 'display:inline-flex; align-items:center; gap:3px; margin-left:6px; padding:0 8px; height:22px; border-radius:999px; font-size:12px; font-weight:500; line-height:1; vertical-align:middle; text-decoration:none; cursor:pointer; white-space:nowrap;';
function decorateMovementVideos(root){
  if(!MV_MAP) return;
  (root || document).querySelectorAll('[data-mv]').forEach(div=>{
    div.querySelectorAll('.mv-btn').forEach(b => b.remove());
    const name = div.dataset.mv;
    const hit = findMovementVideo(name, div.textContent);
    if(hit){
      const a = document.createElement('a');
      a.className = 'mv-btn';
      a.href = hit.url; a.target = '_blank'; a.rel = 'noopener';
      a.style.cssText = 'display:inline-flex; align-items:center; margin-left:6px; vertical-align:middle; line-height:0;';
      a.title = 'YouTube';
      a.innerHTML = '<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" rx="3.5" fill="#FF0000"/><path d="M8 4v6l5.2-3z" fill="#fff"/></svg>';
      a.onclick = e => e.stopPropagation();
      div.appendChild(a);
    }
  });
}
function normalizeVideoUrl(u){
  u = String(u || '').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
async function saveMovementVideo(name, url){
  name = String(name || '').trim();
  url = normalizeVideoUrl(url);
  if(!name || !url) return '동작 이름과 링크를 모두 넣어주세요.';
  const { error } = await sb.from('movement_videos').upsert({ name, url, updated_at: new Date().toISOString() }, { onConflict: 'name' });
  if(error) return '저장에 실패했어요: ' + error.message;
  await loadMovementVideos();
  if(document.getElementById('mv-list')){ renderMovementVideoList(); renderMovementPicker(); }
  return '';
}
async function promptMovementVideo(name, current){
  const url = window.prompt('"' + name + '" 유튜브 링크를 붙여넣어 주세요', current || '');
  if(url === null) return;
  if(!url.trim()){ return; }
  const err = await saveMovementVideo(name, url);
  if(err) alert(err);
}
async function renderMovementPicker(){
  const el = document.getElementById('mv-picker');
  const dateEl = document.getElementById('mv-date');
  if(!el || !dateEl) return;
  if(!dateEl.value) dateEl.value = todayStr();
  if(!MV_MAP) await loadMovementVideos();
  const { data } = await sb.from('programs').select('items').eq('date', dateEl.value).maybeSingle();
  const items = (data && data.items) || [];
  if(!items.length){ el.innerHTML = '<p class="muted" style="font-size:14px; margin:0;">이 날은 프로그램이 없어요.</p>'; return; }
  const bySec = new Map();
  items.forEach(it=>{
    const sec = stripLabelPrefix(it.section || '기타');
    if(!bySec.has(sec)) bySec.set(sec, []);
    const list = bySec.get(sec);
    splitPrescribedLines(it.prescribed).forEach(l=>{
      const n = extractMovementName(l);
      if(n && !list.some(x => normMv(x) === normMv(n))) list.push(n);
    });
  });
  el.innerHTML = '';
  bySec.forEach((names, sec)=>{
    if(!names.length) return;
    const g = document.createElement('div');
    g.innerHTML = '<p class="muted" style="font-size:12px; font-weight:500; letter-spacing:0.04em; margin:0 0 6px;">' + escapeHtml(sec) + '</p><div class="mv-chips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>';
    const wrap = g.querySelector('.mv-chips');
    names.forEach(n=>{
      const has = !!MV_MAP.get(normMv(n));
      const c = document.createElement('button');
      c.type = 'button';
      c.style.cssText = 'height:30px; padding:0 10px; border-radius:999px; font-size:13px; font-weight:400; display:inline-flex; align-items:center; gap:5px;' + (has ? 'color:var(--text-muted);' : '');
      c.innerHTML = (has ? '<svg width="14" height="10" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" rx="3.5" fill="#FF0000"/><path d="M8 4v6l5.2-3z" fill="#fff"/></svg>' : '') + escapeHtml(n);
      c.onclick = ()=>{
        const hit = MV_MAP.get(normMv(n));
        document.getElementById('mv-name').value = hit ? hit.name : n;
        document.getElementById('mv-url').value = hit ? hit.url : '';
        document.getElementById('mv-status').textContent = hit ? '이미 등록된 영상이에요. 링크를 바꾸고 저장하면 수정돼요.' : '';
        document.getElementById('mv-status').className = 'status';
        document.getElementById('mv-url').focus();
      };
      wrap.appendChild(c);
    });
    el.appendChild(g);
  });
}
async function renderMovementVideoList(){
  const el = document.getElementById('mv-list');
  if(!el) return;
  if(!MV_MAP) await loadMovementVideos();
  const q = normMv(document.getElementById('mv-search').value);
  const rows = [...MV_MAP.values()].filter(v => !q || normMv(v.name).includes(q)).sort((a, b)=> a.name.localeCompare(b.name));
  document.getElementById('mv-count').textContent = MV_MAP.size ? MV_MAP.size + '개' : '';
  el.innerHTML = rows.length ? '' : '<p class="muted" style="font-size:14px;">' + (MV_MAP.size ? '검색 결과가 없어요.' : '아직 등록된 영상이 없어요.') + '</p>';
  rows.forEach(v=>{
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:0.5px solid var(--border);';
    row.innerHTML = '<a href="' + escapeAttr(v.url) + '" target="_blank" rel="noopener" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-primary); text-decoration:none; font-size:15px;">▶ ' + escapeHtml(v.name) + '</a>'
      + '<button type="button" class="mv-edit" style="height:30px; font-size:13px; padding:0 10px;">수정</button>'
      + '<button type="button" class="mv-del danger" style="height:30px; font-size:13px; padding:0 10px;">삭제</button>';
    row.querySelector('.mv-edit').onclick = ()=> promptMovementVideo(v.name, v.url);
    row.querySelector('.mv-del').onclick = async ()=>{
      if(!confirm('"' + v.name + '" 영상을 삭제할까요?')) return;
      const { error } = await sb.from('movement_videos').delete().eq('name', v.name);
      if(error){ alert('삭제에 실패했어요: ' + error.message); return; }
      await loadMovementVideos();
      renderMovementVideoList();
      renderMovementPicker();
    };
    el.appendChild(row);
  });
}
new MutationObserver(muts=>{
  if(!MV_MAP) return;
  for(const m of muts) for(const n of m.addedNodes){
    if(n.nodeType !== 1 || n.classList.contains('mv-btn')) continue;
    if(n.matches('[data-mv]') || n.querySelector('[data-mv]')) decorateMovementVideos(n.matches('[data-mv]') ? n.parentNode : n);
  }
}).observe(document.body, { childList: true, subtree: true });
loadMovementVideos();

// 테마 CSS 변수를 읽어서 라이트/다크 둘 다 자연스럽게 어울리는 차트를 만들어요.
function cssVarRaw(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function buildGlassLineChart(canvas, { labels, data, label, suffix, highlights, tooltipLabel }){
  const accent = cssVarRaw('--chart-accent') || '74, 122, 181';
  const gridColor = cssVarRaw('--chart-grid') || 'rgba(0,0,0,0.07)';
  const tooltipBg = cssVarRaw('--chart-tooltip-bg') || 'rgba(24,24,22,0.86)';
  const tooltipBorder = cssVarRaw('--chart-tooltip-border') || 'rgba(255,255,255,0.14)';
  const mutedColor = cssVarRaw('--text-muted') || '#8f8c85';
  const surfaceColor = cssVarRaw('--surface-1') || '#ffffff';
  const monoFont = cssVarRaw('--font-mono') || 'monospace';
  const isHi = (i)=> Array.isArray(highlights) && highlights[i];

  return new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: label || '',
        data,
        borderColor: `rgba(${accent},0.9)`,
        borderWidth: 2,
        // 차트 영역 기준 세로 그라데이션이라 리사이즈돼도 자연스럽게 유지돼요
        backgroundColor: (ctx)=>{
          const { ctx: c, chartArea } = ctx.chart;
          if(!chartArea) return 'transparent';
          const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
          g.addColorStop(0, `rgba(${accent},0.30)`);
          g.addColorStop(1, `rgba(${accent},0.01)`);
          return g;
        },
        fill: true,
        tension: 0.35,
        pointRadius: (ctx)=> isHi(ctx.dataIndex) ? 5 : 3.5,
        pointHoverRadius: (ctx)=> isHi(ctx.dataIndex) ? 7 : 5.5,
        pointBackgroundColor: (ctx)=> isHi(ctx.dataIndex) ? `rgb(${accent})` : surfaceColor,
        pointBorderColor: `rgba(${accent},0.9)`,
        pointBorderWidth: 2,
        pointHoverBorderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 600, easing: 'easeOutQuart' },
      interaction: { intersect: false, mode: 'index' },
      layout: { padding: { top: 8, right: 4, left: 0, bottom: 0 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: tooltipBg,
          borderColor: tooltipBorder,
          borderWidth: 1,
          cornerRadius: 10,
          padding: 10,
          displayColors: false,
          titleColor: 'rgba(255,255,255,0.6)',
          titleFont: { size: 11, family: monoFont, weight: '400' },
          bodyColor: '#ffffff',
          bodyFont: { size: 14, weight: '600' },
          callbacks: {
            label: tooltipLabel || ((ctx)=> `${round1(ctx.parsed.y)}${suffix || ''}`)
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { display: false },
          ticks: {
            color: mutedColor,
            font: { size: 11, family: monoFont },
            maxRotation: 0,
            autoSkip: true,
            maxTicksLimit: 5
          }
        },
        y: {
          grid: { color: gridColor, drawTicks: false },
          border: { display: false },
          ticks: {
            color: mutedColor,
            font: { size: 11, family: monoFont },
            padding: 8,
            maxTicksLimit: 5,
            callback: (v)=> `${round1(v)}${suffix || ''}`
          }
        }
      }
    }
  });
}

// 저장은 항상 kg 기준. 표시/입력 시에만 lb <-> kg 변환.
const KG_PER_LB = 0.45359237;
function toKg(value, unit){ return unit === 'lb' ? value * KG_PER_LB : value; }
function fromKg(kgValue, unit){ return unit === 'lb' ? kgValue / KG_PER_LB : kgValue; }
function formatWeight(kgValue, unit){
  const v = fromKg(kgValue, unit);
  return (Math.round(v * 10) / 10) + (unit === 'lb' ? 'lb' : 'kg');
}

function switchTab(tab){

    else document.getElementById(id).classList.add('hidden');

  ['log','board','profile','admin'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', t === tab);

  if(tab === 'log') loadDatesForLog();
  if(tab === 'board') renderBoard();
  if(tab === 'profile') renderProfileList();
  if(tab === 'admin' && !document.getElementById('admin-panel').classList.contains('hidden')) renderAdminProgramList();
}

function validateProgramItems(items){
  if(!Array.isArray(items) || items.length === 0) throw new Error('항목이 비어 있어요');
  const validTypes = ['weight','for_time','amrap','emom_complete','reps','barbell_conditioning','amrap_by_round','weight_by_round','emom_by_round'];
  items.forEach((it, i)=>{
    if(!it.section || !it.name || !it.type || !it.prescribed){
      throw new Error(`${i+1}번째 항목에 필수 필드(section/name/type/prescribed)가 없어요`);
    }
    if(!validTypes.includes(it.type)){
      throw new Error(`${i+1}번째 항목의 type "${it.type}"이 유효하지 않아요 (${validTypes.join('/')} 중 하나여야 해요)`);
    }
    if((it.type === 'amrap_by_round' || it.type === 'weight_by_round' || it.type === 'emom_by_round') && !it.rounds){
      throw new Error(`${i+1}번째 항목(${it.name})은 type이 "${it.type}"이라 "rounds"(라운드 수, 숫자) 필드가 필요해요`);
    }
    if(it.type === 'barbell_conditioning' && (!Array.isArray(it.movements) || it.movements.length === 0)){
      throw new Error(`${i+1}번째 항목(${it.name})은 type이 "barbell_conditioning"이라 "movements"(동작 이름 목록)가 최소 1개 필요해요`);
    }
  });
}

function extractJsonArray(raw){
  let s = raw.trim();
  s = s.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  const start = s.indexOf('[');
  const end = s.lastIndexOf(']');
  if(start === -1 || end === -1 || end < start){
    throw new Error('JSON 배열을 찾을 수 없어요. 원문: ' + s.slice(0, 300));
  }
  return JSON.parse(s.slice(start, end + 1));
}

async function callParseFunction(programText){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/parse-wod`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({ programText })
  });
  const data = await res.json();
  if(!res.ok || data.error){
    throw new Error(data.error || `함수 호출 중 오류가 발생했어요 (${res.status})`);
  }
  return data.result;
}

function escapeHtml(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function editorItemsToClean(){
  return editorItems.map(it=>{
    const clean = {
      section: (it.section || '').trim(),
      name: (it.name || '').trim(),
      type: it.type,
      prescribed: (it.prescribed || '').trim()
    };
    if(it.subsection && it.subsection.trim()) clean.subsection = it.subsection.trim();
    if(['amrap_by_round','weight_by_round','emom_by_round'].includes(it.type)) clean.rounds = parseInt(it.rounds) || 0;
    if(it.type === 'barbell_conditioning') clean.movements = (it.movements || []).map(m=>m.trim()).filter(Boolean);
    return clean;
  });
}

// ---------- 무게 힌트: 이름을 넣으면 지난 기록·최고 기록을 보여주고, "@85%"가 있으면 무게를 계산해요 ----------
const normLiftName = s => String(s || '').toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
function roundToPlate(kg, unit){
  const step = unit === 'lb' ? 5 : 2.5;
  return Math.round(fromKg(kg, unit) / step) * step;
}
function parsePercent(text){
  const m = String(text || '').match(/@\s*(\d{2,3})\s*%/);
  return m ? parseInt(m[1], 10) : null;
}
const OF_TODAY_RE = /of what you hit|of today|of (the )?heaviest|of that/i;
function shortDate(d){ const p = String(d).split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : d; }

function setupWeightHints(el, program, date){
  const nameInput = document.getElementById('log-username');
  if(!nameInput) return;
  if(!nameInput.value) nameInput.value = localStorage.getItem('bruteLogName') || '';
  let hist = [], keyLifts = [], timer = null;

  const findKeyLift = (itemName)=>{
    const n = normLiftName(itemName);
    return keyLifts.find(k => normLiftName(k.lift_name) === n)
      || keyLifts.find(k => { const k2 = normLiftName(k.lift_name); return k2.length >= 4 && (n.includes(k2) || k2.includes(n)); });
  };

  const renderCard = (card)=>{
    const box = card.querySelector('.calc-hint');
    if(!box) return;
    const it = program.items[card.dataset.idx];
    const unitSel = card.querySelector('.unit-select');
    const unit = unitSel ? unitSel.value : getPreferredUnit();
    const u = unit === 'lb' ? 'lb' : 'kg';
    const n = normLiftName(it.name);
    const past = hist.filter(r => normLiftName(r.item_name) === n && r.date < date && !r.skipped && !isNaN(parseFloat(r.value)));
    const last = past[0];
    const best = past.reduce((m, r)=> Math.max(m, parseFloat(r.value)), 0);
    const key = findKeyLift(it.name);
    const lines = [];
    if(last){
      const lv = parseFloat(last.value);
      lines.push('<div style="color:var(--text-secondary);">지난 기록 ' + formatWeight(lv, unit) + ' · ' + shortDate(last.date) + (best > lv ? ' &nbsp;·&nbsp; 최고 ' + formatWeight(best, unit) : '') + '</div>');
    }
    const pct = parsePercent(it.prescribed);
    const calcLine = (kg, note)=> '<div style="color:var(--border-accent); font-weight:500;">' + pct + '% → ' + roundToPlate(kg * pct / 100, unit) + u + ' <span style="font-weight:400;">(' + note + ')</span></div>';
    if(pct){
      const inp = card.querySelector('.rec-input');
      const todayVal = inp && parseFloat(inp.value);
      if(OF_TODAY_RE.test(it.prescribed)){
        if(todayVal) lines.push(calcLine(toKg(todayVal, unit), '오늘 ' + todayVal + u + ' 기준'));
        else lines.push('<div style="color:var(--text-muted);">오늘 무게를 넣으면 ' + pct + '% 무게를 계산해줘요</div>');
      } else if(key){
        lines.push(calcLine(key.value_kg, '주요 리프트 ' + escapeHtml(key.lift_name) + ' ' + formatWeight(key.value_kg, unit) + ' 기준'));
      } else if(best){
        lines.push(calcLine(best, '지난 최고 ' + formatWeight(best, unit) + ' 기준'));
      }
    }
    box.innerHTML = lines.join('');
    box.style.display = lines.length ? 'flex' : 'none';
  };
  const renderAll = ()=> el.querySelectorAll('.card[data-idx]').forEach(renderCard);

  const load = async ()=>{
    const name = nameInput.value.trim();
    localStorage.setItem('bruteLogName', name);
    if(!name){ hist = []; keyLifts = []; renderAll(); return; }
    const [r1, r2] = await Promise.all([
      sb.from('records').select('item_name, value, date, skipped').eq('name', name).eq('type', 'weight').order('date', { ascending: false }),
      sb.from('key_lifts').select('lift_name, value_kg').eq('name', name)
    ]);
    if(nameInput.value.trim() !== name) return;
    hist = r1.data || [];
    keyLifts = r2.data || [];
    renderAll();
  };
  nameInput.addEventListener('input', ()=>{ clearTimeout(timer); timer = setTimeout(load, 400); });
  el.querySelectorAll('.card[data-idx]').forEach(card=>{
    if(!card.querySelector('.calc-hint')) return;
    const inp = card.querySelector('.rec-input');
    const sel = card.querySelector('.unit-select');
    if(inp) inp.addEventListener('input', ()=> renderCard(card));
    if(sel) sel.addEventListener('change', ()=> renderCard(card));
  });
  load();
}

// ---------- Personal Training: 프로그램 외 개인 운동 (영문 UI, 순위 제외) ----------
const PERSONAL_SECTION = 'Personal';
const PERSONAL_TYPES = [
  { key: 'accessory', label: 'Accessory', hint: '세트별 무게 × 횟수 (무게 선택)' },
  { key: 'skill', label: 'Skill', hint: '오늘 연습한 내용 메모' },
  { key: 'lifting', label: 'Lifting', hint: '세트별 무게 × 횟수' },
  { key: 'emom', label: 'EMOM', hint: 'N분마다 반복, 동작별 횟수' },
  { key: 'fortime', label: 'For Time', hint: '동작 + 완료 시간' },
  { key: 'amrap', label: 'AMRAP', hint: '동작 + 라운드·개수' }
];

function ensurePersonalDatalist(programItems){
  let dl = document.getElementById('personal-movements');
  if(!dl){ dl = document.createElement('datalist'); dl.id = 'personal-movements'; document.body.appendChild(dl); }
  const names = new Set();
  (programItems || []).forEach(it=>{
    if(it.name && it.name !== 'Warm Up') names.add(it.name);
    (it.movements || []).forEach(m => names.add(m));
  });
  const fill = ()=>{ dl.innerHTML = [...names].sort().map(n => '<option value="' + escapeAttr(n) + '"></option>').join(''); };
  fill();
  sb.from('records').select('item_name').then(({ data })=>{
    (data || []).forEach(r=>{ if(r.item_name && !/\s-\s/.test(r.item_name)) names.add(r.item_name); });
    fill();
  });
}

function parsePersonalDetail(r){
  const d = r && r.scale_detail;
  if(!d || d[0] !== '§') return null;
  try { return JSON.parse(d.slice(1)); } catch(e){ return null; }
}
function personalDetailHtml(r, unit){
  const p = parsePersonalDetail(r);
  if(!p) return null;
  const w = kg => formatWeight(kg, unit);
  const rows = [];
  if(p.spec) rows.push('<div style="color:var(--text-muted);">' + escapeHtml(p.spec) + '</div>');
  if(p.sets && p.sets.length){
    rows.push('<div style="display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 14px;">'
      + p.sets.map((s, i) => '<span style="color:var(--text-muted);">' + (i + 1) + '세트</span><span>'
        + (s.kg != null ? w(s.kg) + (s.r ? ' × ' + escapeHtml(s.r) : '') : escapeHtml(s.r) + '회') + '</span>').join('')
      + '</div>');
  }
  if(p.moves && p.moves.length){
    rows.push('<div style="display:flex; flex-direction:column; gap:2px;">' + p.moves.map(m => '<span>' + escapeHtml([m.r, m.n].filter(Boolean).join(' '))
      + (m.kg != null ? ' <span style="color:var(--text-muted);">@ ' + w(m.kg) + '</span>' : '') + '</span>').join('') + '</div>');
  }
  let html = rows.length ? '<div style="display:flex; flex-direction:column; gap:6px; margin-top:6px; font-size:14px; line-height:1.5; color:var(--text-secondary);">' + rows.join('') + '</div>' : '';
  if(p.notes) html += '<div style="margin-top:6px;"><span class="tag scaled" style="white-space:normal;">※ ' + escapeHtml(p.notes) + '</span></div>';
  return html;
}

    row.style.cssText = 'display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 32px; gap:6px; align-items:center; margin-bottom:6px;';

        + '<div class="p-sets"></div><button type="button" class="p-add-set" style="height:32px; font-size:14px;">+ 세트 추가</button>' + notesHtml;
    } else if(type === 'skill'){
      body = '<input type="text" class="p-name" list="personal-movements" placeholder="스킬 (예: Handstand Walk)" style="width:100%; margin-bottom:8px;" />'
        + '<textarea class="p-notes" rows="3" placeholder="오늘 뭘 연습했고 어디까지 됐는지 적어주세요" style="width:100%; font-size:15px; resize:vertical;"></textarea>';
    } else if(type === 'emom'){

        + field('간격 (분)', '<input type="number" inputmode="numeric" class="p-every" value="1" min="1" />')
        + field('라운드', '<input type="number" inputmode="numeric" class="p-rounds" placeholder="10" />')
        + '</div>' + movesBlock
        + '<div style="display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:8px; margin-top:10px;">'
        + field('결과', '<select class="p-result"><option value="">선택</option><option value="done">전체 완료</option><option value="fail">중간 실패</option></select>')
        + '<div class="p-fail-wrap" style="visibility:hidden;">' + field('실패 라운드', '<input type="number" inputmode="numeric" class="p-fail-round" />') + '</div>'
        + '</div>' + notesHtml;
    } else if(type === 'fortime'){
      body = '<input type="text" class="p-name" placeholder="이름 (선택, 예: Fran)" style="width:100%; margin-bottom:10px;" />'
        + field('라운드', '<input type="number" inputmode="numeric" class="p-rounds" placeholder="1" style="width:100px;" />')
        + movesBlock
        + '<div class="p-time-wrap" style="margin-top:10px;">' + field('시간', '<div style="display:flex; gap:4px; align-items:center;"><input type="number" inputmode="numeric" class="p-min" placeholder="분" style="width:70px;" /><span>:</span><input type="number" inputmode="numeric" class="p-sec" placeholder="초" style="width:70px;" /></div>') + '</div>'
        + '<label style="display:flex; align-items:center; gap:6px; font-size:15px; margin:10px 0 0;"><input type="checkbox" class="p-capped" style="width:auto; height:auto;" />타임캡 걸림</label>'

        + notesHtml;

    if(cap) cap.onchange = ()=>{

      card.querySelector('.p-time-wrap').style.display = cap.checked ? 'none' : 'block';

  function collect(date, name){
    const out = [];
    entries.querySelectorAll('.p-entry').forEach(card=>{
      const type = card.dataset.ptype;
      const q = s => card.querySelector(s);
      const val = s => { const e = q(s); return e ? String(e.value).trim() : ''; };
      const unit = q('.p-unit') ? q('.p-unit').value : getPreferredUnit();
      const kgOf = v => { const n = parseFloat(v); return isNaN(n) ? null : Math.round(toKg(n, unit) * 100) / 100; };
      const notes = val('.p-notes');
      const nm = val('.p-name');
      const push = (item_name, recType, value, detail)=>{
        Object.keys(detail).forEach(k => { const v = detail[k]; if(v == null || v === '' || (Array.isArray(v) && !v.length)) delete detail[k]; });
        out.push({ date, name, item_name, section: PERSONAL_SECTION, type: recType, value: String(value), scaled: !!detail.notes, scale_detail: '§' + JSON.stringify(detail), skipped: false });
      };
      const moves = [...card.querySelectorAll('.p-move')].map(r => ({
        n: r.querySelector('.p-mn').value.trim(), r: r.querySelector('.p-mr').value.trim(), kg: kgOf(r.querySelector('.p-mw').value)
      })).filter(m => m.n);
      const autoTitle = moves.map(m => m.n).join(' + ');
      if(moves.some(m => m.kg != null)) setPreferredUnit(unit);

      if(type === 'accessory' || type === 'lifting'){
        if(!nm) return;
        const sets = [...card.querySelectorAll('.p-set')].map(r => ({ kg: kgOf(r.querySelector('.p-w').value), r: r.querySelector('.p-r').value.trim() }))
          .filter(s => s.kg != null || s.r);
        if(!sets.length) return;
        const weighted = sets.filter(s => s.kg != null);
        if(weighted.length){
          setPreferredUnit(unit);
          push(nm, 'weight', Math.max(...weighted.map(s => s.kg)), { sets, notes });
        } else {
          const total = sets.reduce((a, s) => a + (parseInt(s.r) || 0), 0);
          push(nm, 'reps', total, { sets, notes });
        }
      } else if(type === 'skill'){
        if(!nm && !notes) return;
        push(nm || 'Skill Practice', 'note', 'Practice', { notes });
      } else if(type === 'emom'){
        const r = val('.p-result');
        if(!r) return;
        const every = parseInt(val('.p-every')) || 1;
        const rounds = parseInt(val('.p-rounds'));
        const label = every === 1 ? 'EMOM' : 'E' + every + 'MOM';
        const spec = label + (rounds ? ' · ' + rounds + ' rounds (' + every * rounds + ' min)' : '');
        const value = r === 'done' ? 'Completed' : 'Failed R' + (val('.p-fail-round') || '?');
        push(nm || (label + ' ' + autoTitle).trim(), 'emom_complete', value, { spec, moves, notes });
      } else if(type === 'fortime'){
        const rounds = parseInt(val('.p-rounds'));
        const detail = { spec: rounds > 1 ? rounds + ' rounds for time' : '', moves, notes };
        const title = nm || autoTitle || 'For Time';
        if(q('.p-capped').checked){
          push(title, 'amrap', 'CAP +' + (val('.p-cap-reps') || 0) + ' reps', detail);
        } else {
          const m = val('.p-min'), s = val('.p-sec');
          if(!m && !s) return;
          push(title, 'for_time', (parseInt(m) || 0) + ':' + String(parseInt(s) || 0).padStart(2, '0'), detail);
        }
      } else if(type === 'amrap'){
        const r = val('.p-res-rounds'), rp = val('.p-res-reps');
        if(!r && !rp) return;
        const dur = val('.p-duration');
        push(nm || autoTitle || 'AMRAP', 'amrap', (parseInt(r) || 0) + ' rounds + ' + (parseInt(rp) || 0) + ' reps', { spec: dur ? dur + ' min AMRAP' : '', moves, notes });
      }
    });
    return out;
  }

  return { box, collect };
}

async function renderLogForm(date){
  const el = document.getElementById('log-form');
  el.innerHTML = '<p class="muted">불러오고 있어요...</p>';
  const { data, error } = await sb.from('programs').select('*').eq('date', date).single();
  const program = (error || !data) ? { items: [] } : data;
  el.innerHTML = '';
  if(!program.items || !program.items.length){
    program.items = [];
    const none = document.createElement('p');
    none.className = 'muted';
    none.style.margin = '0 0 16px';
    none.textContent = '이 날은 프로그램이 없어요. 아래에서 개인 운동은 기록할 수 있어요.';
    el.appendChild(none);
  }


  const nameWrap = document.createElement('div');
  nameWrap.style.marginBottom = "16px";
  nameWrap.innerHTML = `<label>이름</label><input type="text" id="log-username" class="name-input" placeholder="이름을 입력해주세요" />`;
  el.appendChild(nameWrap);
  setTimeout(()=> setupWeightHints(el, program, date), 0);

  // section별로 큰 박스, 그 안에서 subsection별로 소분류
  const bySection = {};
  program.items.forEach((it, idx)=>{
    const sec = it.section || '기타';
    if(!bySection[sec]) bySection[sec] = [];
    bySection[sec].push({ ...it, idx });
  });

  Object.entries(bySection).forEach(([sectionName, sectionItems], sIdx)=>{
    const sectionBox = document.createElement('div');
    sectionBox.style.cssText = 'background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:16px; box-shadow:var(--card-shadow);';

    const sectionEyebrow = document.createElement('p');
    sectionEyebrow.className = 'eyebrow';
    sectionEyebrow.textContent = `SECTION 0${sIdx + 1}`;
    sectionBox.appendChild(sectionEyebrow);

    const sectionTitle = document.createElement('h3');
    sectionTitle.style.cssText = 'font-size:18px; font-weight:500; margin:0 0 12px;';
    sectionTitle.textContent = stripLabelPrefix(sectionName);
    sectionBox.appendChild(sectionTitle);

    const bySub = {};
    sectionItems.forEach(it=>{
      const sub = it.subsection || '';
      if(!bySub[sub]) bySub[sub] = [];
      bySub[sub].push(it);
    });

    Object.entries(bySub).forEach(([subName, subItems])=>{
      if(subName && !isSameLabel(subName, sectionName)){
        const subTitle = document.createElement('p');
        subTitle.className = 'muted';
        subTitle.style.cssText = 'font-weight:500; margin:0 0 8px; font-size:15px;';
        subTitle.textContent = stripLabelPrefix(subName);
        sectionBox.appendChild(subTitle);
      }

      subItems.forEach(it=>{
        const idx = it.idx;

        if(it.type === 'barbell_conditioning'){
          sectionBox.appendChild(buildBarbellConditioningCard(it, idx, subName));
          return;
        }

        if(it.type === 'amrap_by_round' || it.type === 'weight_by_round' || it.type === 'emom_by_round'){
          sectionBox.appendChild(buildByRoundCard(it, idx, subName));
          return;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginLeft = '0';
        card.dataset.idx = idx;

        let inputHtml = '';
        const prefUnit = getPreferredUnit();
        if(it.type === 'weight'){

        <label style="display:flex; align-items:center; gap:4px; font-size:15px; margin:0;"><input type="checkbox" class="skip-check" style="width:auto; height:auto;" />오늘 생략</label>

      <div class="skip-reason-wrap hidden" style="margin-bottom:8px;">

  const personal = buildPersonalSection(program.items);
  el.appendChild(personal.box);

  const saveWrap = document.createElement('div');
  saveWrap.className = 'row';
  saveWrap.style.marginTop = '16px';
  saveWrap.innerHTML = `<button class="primary" id="log-save-btn">저장하기</button><span class="status" id="log-save-status"></span>`;
  el.appendChild(saveWrap);

  document.getElementById('log-save-btn').onclick = async ()=>{
    const saveBtn = document.getElementById('log-save-btn');
    const status = document.getElementById('log-save-status');
    if(saveBtn.disabled) return;
    const name = document.getElementById('log-username').value.trim();
    if(!name){ status.textContent = "이름을 입력해주세요"; status.className = "status err"; return; }
    saveBtn.disabled = true;
    status.textContent = "저장하고 있어요..."; status.className = "status";
    const cards = el.querySelectorAll('[data-idx]');
    const records = [];
    cards.forEach(c=>{
      const idx = parseInt(c.dataset.idx);
      const item = program.items[idx];
      const skipped = c.querySelector('.skip-check').checked;

      if(skipped){
        const skipReason = c.querySelector('.skip-reason').value.trim();
        records.push({
          date, name, item_name: item.name, section: item.section, type: item.type,
          value: '생략', scaled: true, scale_detail: skipReason ? `생략: ${skipReason}` : '생략함', skipped: true
        });
        return;
      }

      const scaled = c.querySelector('.scale-check').checked;
      const scaleDetail = c.querySelector('.scale-detail').value.trim();

      if(item.type === 'barbell_conditioning'){
        const rows = c.querySelectorAll('.movement-row');
        rows.forEach(row=>{
          const mName = row.querySelector('.movement-name').value.trim();
          const mWeight = row.querySelector('.movement-weight').value;
          const mUnit = row.querySelector('.movement-unit').value;
          const mStatus = row.querySelector('.movement-status').value;
          if(!mName || !mWeight) return;
          setPreferredUnit(mUnit);
          const kgValue = Math.round(toKg(parseFloat(mWeight), mUnit) * 100) / 100;
          records.push({
            date, name, item_name: `${item.name} - ${mName}`, section: item.section, type: 'weight',
            value: kgValue.toString(), scaled: scaled || !!mStatus,
            scale_detail: [scaleDetail, mStatus].filter(Boolean).join(' / '),
            skipped: false
          });
        });
        return;
      }

      if(item.type === 'amrap_by_round' || item.type === 'weight_by_round' || item.type === 'emom_by_round'){
        const rows = c.querySelectorAll('.round-row');
        rows.forEach(row=>{
          const r = row.dataset.round;
          const inp = row.querySelector('.round-input');
          let val = inp ? inp.value : '';
          if(!val) return;

          let recType = 'reps';
          if(item.type === 'weight_by_round'){
            const unitSel = row.querySelector('.round-unit');
            const unit = unitSel ? unitSel.value : 'kg';
            setPreferredUnit(unit);
            val = (Math.round(toKg(parseFloat(val), unit) * 100) / 100).toString();
            recType = 'weight';
          } else if(item.type === 'emom_by_round'){
            recType = 'status';
          }

          records.push({
            date, name, item_name: `${item.name} - ${r}R`, section: item.section, type: recType,
            value: val, scaled, scale_detail: scaleDetail, skipped: false
          });
        });
        return;
      }

      let value = '';
      if(item.type === 'for_time'){
        const min = c.querySelector('.rec-min').value || '0';
        const sec = c.querySelector('.rec-sec').value || '0';
        value = `${min}:${sec.padStart(2,'0')}`;
      } else if(item.type === 'weight'){
        const inp = c.querySelector('.rec-input');
        const unitSel = c.querySelector('.unit-select');
        if(inp && inp.value){
          const rawNum = parseFloat(inp.value);
          const unit = unitSel ? unitSel.value : 'kg';
          setPreferredUnit(unit);
          value = (Math.round(toKg(rawNum, unit) * 100) / 100).toString();
        }
      } else {
        const inp = c.querySelector('.rec-input');
        value = inp ? inp.value : '';
      }
      if(value) records.push({
        date, name, item_name: item.name, section: item.section, type: item.type,
        value, scaled, scale_detail: scaleDetail, skipped: false
      });
    });
    records.push(...personal.collect(date, name));
    if(records.length === 0){ status.textContent = "기록을 최소 1개 이상 입력해주세요"; status.className = "status err"; saveBtn.disabled = false; return; }
    const { error } = await sb.from('records').insert(records);
    if(error){ status.textContent = "저장에 실패했어요: " + error.message; status.className = "status err"; saveBtn.disabled = false; return; }
    status.textContent = "저장했어요"; status.className = "status ok";
  };
}

async function renderBoard(){
  const el = document.getElementById('board-content');
  el.innerHTML = '<p class="muted">불러오고 있어요...</p>';

  const { data: programDates, error: progError } = await sb.from('programs').select('date').order('date', { ascending: false });
  if(progError){ el.innerHTML = `<p class="status err">${progError.message}</p>`; return; }
  if(!programDates || programDates.length === 0){ el.innerHTML = '<p class="muted">등록된 프로그램이 없어요.</p>'; return; }

  const currentUnit = getPreferredUnit();

  const topBar = document.createElement('div');
  topBar.className = 'row';
  topBar.style.marginBottom = '16px';
  topBar.innerHTML = `
    <input type="date" id="board-date-select" style="width:160px;" />
    <label style="margin:0; font-size:15px;">단위</label>
    <select id="board-unit-select" style="width:80px;">
      <option value="lb" ${currentUnit==='lb'?'selected':''}>lb</option>
      <option value="kg" ${currentUnit==='kg'?'selected':''}>kg</option>
    </select>
  `;
  el.innerHTML = '';
  el.appendChild(topBar);

  const boardDateList = programDates.map(row=>row.date);
  const dateSel = document.getElementById('board-date-select');
  const boardHint = document.createElement('p');
  boardHint.className = 'muted';
  boardHint.style.cssText = 'font-size:14px; margin:-8px 0 12px;';
  topBar.insertAdjacentElement('afterend', boardHint);

  const contentBox = document.createElement('div');
  contentBox.id = 'board-leaderboard-content';
  el.appendChild(contentBox);

  function handleBoardDateChange(date){
    const unit = document.getElementById('board-unit-select').value;
    if(boardDateList.includes(date)){
      boardHint.textContent = '';
      renderLeaderboardFor(date, unit);
    } else {
      boardHint.textContent = '이 날짜에는 등록된 프로그램이 없어요.';
      contentBox.innerHTML = '';
    }
  }

  async function renderLeaderboardFor(date, unit){
    contentBox.innerHTML = '<p class="muted">불러오고 있어요...</p>';

    const { data: program } = await sb.from('programs').select('*').eq('date', date).single();
    const { data: allRecords, error } = await sb.from('records').select('*').eq('date', date);
    if(error){ contentBox.innerHTML = `<p class="status err">${error.message}</p>`; return; }
    const records = (allRecords || []).filter(r => r.section !== PERSONAL_SECTION);
    if(records.length === 0){ contentBox.innerHTML = '<p class="muted">이 날짜에 등록된 기록이 없어요.</p>'; return; }

    const byItemName = {};
    records.forEach(r=>{
      if(!byItemName[r.item_name]) byItemName[r.item_name] = [];
      byItemName[r.item_name].push(r);
    });

    // 프로그램에 등록된 순서(섹션 구조) 기준으로 렌더링
    const itemOrder = [];
    if(program && program.items){
      program.items.forEach(it=>{
        if(it.type === 'barbell_conditioning' && it.movements){
          it.movements.forEach(m=> itemOrder.push({ key: `${it.name} - ${m}`, section: it.section, type: 'weight' }));
        } else if((it.type === 'amrap_by_round' || it.type === 'weight_by_round' || it.type === 'emom_by_round') && it.rounds){
          const recType = it.type === 'weight_by_round' ? 'weight' : (it.type === 'emom_by_round' ? 'status' : 'reps');
          for(let r = 1; r <= parseInt(it.rounds); r++){
            itemOrder.push({ key: `${it.name} - ${r}R`, section: it.section, type: recType });
          }
        } else {
          itemOrder.push({ key: it.name, section: it.section, type: it.type });
        }
      });
    }
    // records에만 있고 program에는 없는 항목(동작명이 자유 추가된 경우)도 포함
    Object.keys(byItemName).forEach(k=>{
      if(!itemOrder.find(io=>io.key === k)) itemOrder.push({ key: k, section: byItemName[k][0].section, type: byItemName[k][0].type });
    });

    contentBox.innerHTML = '';
    const bySection = {};
    itemOrder.forEach(io=>{
      const sec = io.section || '기타';
      if(!bySection[sec]) bySection[sec] = [];
      if(!bySection[sec].find(x=>x.key === io.key)) bySection[sec].push(io);
    });

    Object.entries(bySection).forEach(([sectionName, items], sIdx)=>{
      const sectionBox = document.createElement('div');
      sectionBox.style.cssText = 'background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:16px; box-shadow:var(--card-shadow);';
      const sEyebrow = document.createElement('p');
      sEyebrow.className = 'eyebrow';
      sEyebrow.textContent = `LEADERBOARD 0${sIdx + 1}`;
      sectionBox.appendChild(sEyebrow);
      const sTitle = document.createElement('h3');
      sTitle.style.cssText = 'font-size:18px; font-weight:500; margin:0 0 12px;';
      sTitle.textContent = sectionName;
      sectionBox.appendChild(sTitle);

      items.forEach(io=>{
        const itemRecords = byItemName[io.key] || [];
        if(itemRecords.length === 0) return;

        const itemBox = document.createElement('div');
        itemBox.className = 'card';
        const itemTitle = document.createElement('p');
        itemTitle.className = 'item-name';
        itemTitle.style.marginBottom = '8px';
        itemTitle.textContent = io.key;
        itemBox.appendChild(itemTitle);

        const active = itemRecords.filter(r=>!r.skipped);
        const skipped = itemRecords.filter(r=>r.skipped);

        let sorted;
        if(io.type === 'weight' || io.type === 'reps'){
          sorted = active.slice().sort((a,b)=> (parseFloat(b.value)||0) - (parseFloat(a.value)||0));
        } else if(io.type === 'status'){
          sorted = active.slice().sort((a,b)=> a.name.localeCompare(b.name));
        } else if(io.type === 'for_time'){
          const toSeconds = (v)=>{ const [m,s] = v.split(':').map(Number); return (m||0)*60 + (s||0); };
          sorted = active.slice().sort((a,b)=> toSeconds(a.value) - toSeconds(b.value));
        } else {
          sorted = active.slice().sort((a,b)=> a.name.localeCompare(b.name));
        }

        sorted.forEach((r, rank)=>{
          const row = document.createElement('div');
          row.style.cssText = 'font-size:15px; margin-bottom:6px; padding:6px 8px; border-radius:var(--radius);' + (rank===0 ? ' background:var(--bg-success);' : '');
          const displayValue = r.type === 'weight' ? formatWeight(parseFloat(r.value)||0, unit) : r.value;
          const rankBadge = (io.type==='weight'||io.type==='reps'||io.type==='for_time') ? `<span class="muted mono" style="width:20px; display:inline-block; flex-shrink:0;">${rank+1}</span>` : '';
          const detailTag = r.scaled ? `<span class="tag scaled">※${r.scale_detail ? ' '+r.scale_detail : ''}</span>` : '';
          row.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <span style="display:flex; align-items:center; min-width:0; overflow:hidden;">
                ${rankBadge}<span style="cursor:pointer; text-decoration:underline; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" onclick="switchTab('profile'); setTimeout(()=>showProfileDetail('${r.name.replace(/'/g,"\\'")}'),0)">${r.name}</span>
              </span>
              <strong class="mono" style="font-weight:500; flex-shrink:0;">${displayValue}</strong>
            </div>
            ${detailTag ? `<div style="margin-top:4px;">${detailTag}</div>` : ''}
          `;
          itemBox.appendChild(row);
        });

        if(skipped.length > 0){
          const skipLine = document.createElement('p');
          skipLine.className = 'muted';
          skipLine.style.cssText = 'font-size:14px; margin:6px 0 0;';
          skipLine.textContent = `생략: ${skipped.map(s=>s.name).join(', ')}`;
          itemBox.appendChild(skipLine);
        }

        sectionBox.appendChild(itemBox);
      });

      contentBox.appendChild(sectionBox);
    });
  }

  const today = todayStr();
  const initialBoardDate = boardDateList.includes(today) ? today : boardDateList[0];
  dateSel.value = initialBoardDate;
  renderLeaderboardFor(initialBoardDate, currentUnit);

  dateSel.onchange = ()=> handleBoardDateChange(dateSel.value);
  document.getElementById('board-unit-select').onchange = (e)=>{
    setPreferredUnit(e.target.value);
    if(boardDateList.includes(dateSel.value)) renderLeaderboardFor(dateSel.value, e.target.value);
  };
}

async function renderProfileList(){
  fadeSwap(document.getElementById('profile-list'), document.getElementById('profile-detail'), document.getElementById('profile-item-detail'));
  const el = document.getElementById('profile-list');
  el.innerHTML = '<p class="muted">불러오고 있어요...</p>';
  const { data, error } = await sb.from('records').select('name');
  if(error){ el.innerHTML = `<p class="status err">${error.message}</p>`; return; }
  const privateNames = await getPrivateProfileNames();
  const names = [...new Set([...(data||[]).map(r=>r.name), ...privateNames])].sort();
  if(names.length === 0){ el.innerHTML = '<p class="muted">아직 기록이 없어요.</p>'; return; }
  el.innerHTML = '<p class="muted" style="margin-bottom:12px;">이름을 눌러 개인 기록을 확인해보세요.</p>';
  const wrap = document.createElement('div');

let profileChartInstances = [];
let profileCurrentData = null;
let profileCurrentName = null;
let profileCurrentKeyLifts = [];
let profileCurrentSetting = null;

// ---------- 프로필 공개/비공개 ----------
// PIN 확인과 권한 판단은 전부 Supabase(DB 함수 + RLS)에서 해요. 브라우저는 PIN을 읽을 수 없고,
// 확인에 성공하면 받은 세션 토큰만 저장해서 요청 헤더(x-brute-tokens)에 실어 보내요.
function getProfileTokens(){
  try { return JSON.parse(localStorage.getItem('bruteProfileTokens') || '{}'); } catch(e){ return {}; }
}
function setProfileToken(name, token){
  const m = getProfileTokens();
  if(token) m[name] = token; else delete m[name];
  localStorage.setItem('bruteProfileTokens', JSON.stringify(m));
}
function isAdminUnlocked(){
  const p = document.getElementById('admin-panel');
  return !!sessionStorage.getItem('bruteAdminToken') && !!p && !p.classList.contains('hidden');
}
async function getProfileSetting(name){
  const { data, error } = await sb.from('profile_settings').select('name, is_private').eq('name', name).maybeSingle();
  if(error) return null;
  return data;
}
async function getPrivateProfileNames(){
  const { data, error } = await sb.from('profile_settings').select('name').eq('is_private', true);
  if(error) return new Set();
  return new Set((data||[]).map(r=>r.name));
}
async function canViewProfile(name, setting){
  if(!setting || !setting.is_private) return true;
  const { data, error } = await sb.rpc('can_access', { p_name: name });
  return !error && data === true;
}
function pinErrorMessage(res){
  if(!res) return '확인에 실패했어요. 잠시 뒤에 다시 시도해주세요.';
  if(res.error === 'LOCKED') return 'PIN을 여러 번 틀려서 잠시 잠겼어요. 나중에 다시 시도해주세요.';
  if(res.error === 'WRONG_PIN') return `PIN이 맞지 않아요. (남은 기회 ${res.left}번)`;
  if(res.error === 'BAD_PIN') return 'PIN은 숫자 4자리로 입력해주세요.';
  if(res.error === 'BAD_NAME') return '이 이름은 비공개로 설정할 수 없어요.';
  if(res.error === 'NO_ACCESS') return '권한이 없어요. PIN으로 먼저 열어주세요.';
  return '확인에 실패했어요.';
}

function renderLockedProfile(el, name){
  el.innerHTML = '';
  const back = document.createElement('span');
  back.className = 'back-link';
  back.textContent = '← 전체 명단으로';
  back.onclick = ()=> renderProfileList();
  el.appendChild(back);

  const box = document.createElement('div');
  box.className = 'card';
  box.style.cssText = 'display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:32px 20px; margin-top:8px;';
  box.innerHTML = `
    <span style="${ICON_BTN_STYLE} width:44px; height:44px; margin-bottom:6px;">${LOCK_ICON_SVG}</span>
    <p class="eyebrow" style="margin:0;">PRIVATE</p>
    <h2 style="font-size:20px; font-weight:500; margin:0;"></h2>
    <p class="muted" style="margin:0 0 14px;">비공개 프로필이에요. 본인이라면 PIN을 입력해주세요.</p>
    <div class="row" style="justify-content:center; margin-bottom:0;">
      <input type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN 4자리" style="width:120px; text-align:center; letter-spacing:0.3em;" />
      <button class="primary">열기</button>
    </div>
    <p class="status err" style="margin:8px 0 0; min-height:1.6em;"></p>`;
  box.querySelector('h2').textContent = name;
  const input = box.querySelector('input');
  const btn = box.querySelector('button');
  const status = box.querySelector('.status');
  const tryUnlock = async ()=>{
    btn.disabled = true;
    const { data, error } = await sb.rpc('profile_unlock', { p_name: name, p_pin: input.value.trim() });
    btn.disabled = false;
    if(!error && data && data.ok){
      setProfileToken(name, data.token);
      showProfileDetail(name);
      return;
    }
    if(data && data.error === 'NO_PIN'){ showProfileDetail(name); return; }
    status.textContent = error ? '확인에 실패했어요: ' + error.message : pinErrorMessage(data);
    input.value = '';
    input.focus();
  };
  btn.onclick = tryUnlock;
  input.onkeydown = (e)=>{ if(e.key === 'Enter') tryUnlock(); };
  el.appendChild(box);
}

function buildPrivacyPanel(name, setting){
  const panel = document.createElement('div');
  panel.className = 'card hidden';
  panel.style.marginBottom = '16px';
  const isPrivate = !!(setting && setting.is_private);
  if(isPrivate){
    panel.innerHTML = `
      <p class="eyebrow">PRIVACY</p>
      <p style="margin:0 0 4px; font-weight:500;">지금 비공개 상태예요</p>
      <p class="muted" style="margin:0 0 12px;">PIN이 없으면 이 프로필, 주요 리프트, 전체 기록(순위)에서 기록을 볼 수 없어요.</p>
      <div class="row" style="margin-bottom:0;">
        <button class="primary" data-act="public">공개로 바꾸기</button>
        <button data-act="relock">이 기기에서 잠그기</button>
        <button data-act="change-open">PIN 바꾸기</button>
        ${isAdminUnlocked() ? '<button class="danger" data-act="reset">PIN 초기화</button>' : ''}
      </div>
      <div class="pin-change-wrap hidden" style="margin-top:12px;">
        <div class="row" style="margin-bottom:0;">
          <input type="password" inputmode="numeric" maxlength="4" autocomplete="off" class="pin-old" placeholder="지금 PIN" style="width:110px; text-align:center; letter-spacing:0.2em;" />
          <input type="password" inputmode="numeric" maxlength="4" autocomplete="off" class="pin-new" placeholder="새 PIN" style="width:110px; text-align:center; letter-spacing:0.2em;" />
          <button class="primary" data-act="change">변경</button>
        </div>
      </div>
      <p class="status" style="margin:8px 0 0;"></p>`;
  } else {
    panel.innerHTML = `
      <p class="eyebrow">PRIVACY</p>
      <p style="margin:0 0 4px; font-weight:500;">기록 비공개로 바꾸기</p>
      <p class="muted" style="margin:0 0 12px;">비공개로 바꾸면 PIN이 없는 사람은 이 프로필, 주요 리프트, 전체 기록(순위)에서 기록을 볼 수 없어요. PIN 4자리를 정해주세요. 전에 정한 PIN이 있다면 그 PIN을 입력해주세요. 은행이나 휴대폰 비밀번호와 같은 숫자는 피해주세요.</p>
      <div class="row" style="margin-bottom:0;">
        <input type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN 4자리" style="width:120px; text-align:center; letter-spacing:0.3em;" />
        <button class="primary" data-act="private">비공개로 바꾸기</button>
      </div>
      <p class="status" style="margin:8px 0 0;"></p>`;
  }
  const status = panel.querySelector('.status');
  const fail = (msg)=>{ status.className = 'status err'; status.textContent = msg; };
  panel.querySelectorAll('button[data-act]').forEach(b=>{
    b.onclick = async ()=>{
      const act = b.dataset.act;
      if(act === 'private'){
        const pin = panel.querySelector('input').value.trim();
        if(!/^\d{4}$/.test(pin)){ fail('PIN은 숫자 4자리로 입력해주세요.'); return; }
        b.disabled = true;
        const { data, error } = await sb.rpc('profile_set_private', { p_name: name, p_pin: pin });
        b.disabled = false;
        if(error){ fail('저장에 실패했어요: ' + error.message); return; }
        if(!data || !data.ok){ fail(pinErrorMessage(data)); return; }
        setProfileToken(name, data.token);
        showProfileDetail(name);
      } else if(act === 'public'){
        if(!confirm('공개로 바꿀까요? 누구나 이 프로필을 볼 수 있게 돼요.')) return;
        b.disabled = true;
        const { data, error } = await sb.rpc('profile_set_public', { p_name: name });
        b.disabled = false;
        if(error){ fail('저장에 실패했어요: ' + error.message); return; }
        if(!data || !data.ok){ fail(pinErrorMessage(data)); return; }
        showProfileDetail(name);
      } else if(act === 'change-open'){
        const w = panel.querySelector('.pin-change-wrap');
        w.classList.toggle('hidden');
        if(!w.classList.contains('hidden')) w.querySelector('.pin-old').focus();
      } else if(act === 'change'){
        const oldPin = panel.querySelector('.pin-old').value.trim();
        const newPin = panel.querySelector('.pin-new').value.trim();
        if(!/^\d{4}$/.test(oldPin) || !/^\d{4}$/.test(newPin)){ fail('PIN은 숫자 4자리로 입력해주세요.'); return; }
        if(oldPin === newPin){ fail('새 PIN이 지금 PIN과 같아요.'); return; }
        b.disabled = true;
        const { data, error } = await sb.rpc('profile_change_pin', { p_name: name, p_old: oldPin, p_new: newPin });
        b.disabled = false;
        if(error){ fail('변경에 실패했어요: ' + error.message); return; }
        if(!data || !data.ok){ fail(pinErrorMessage(data)); return; }
        setProfileToken(name, data.token);
        status.className = 'status ok';
        status.textContent = 'PIN을 바꿨어요. 다른 기기는 새 PIN으로 다시 열어야 해요.';
        panel.querySelector('.pin-old').value = '';
        panel.querySelector('.pin-new').value = '';
        panel.querySelector('.pin-change-wrap').classList.add('hidden');
      } else if(act === 'relock'){
        const token = getProfileTokens()[name];
        if(token) await sb.rpc('brute_logout', { p_token: token });
        setProfileToken(name, null);
        showProfileDetail(name);
      } else if(act === 'reset'){
        if(!confirm(`${name}님의 PIN을 초기화하고 공개로 바꿀까요?`)) return;
        const { data, error } = await sb.rpc('admin_reset_profile', { p_name: name });
        if(error){ fail('초기화에 실패했어요: ' + error.message); return; }
        if(!data || !data.ok){ fail(pinErrorMessage(data)); return; }
        showProfileDetail(name);
      }
    };
  });
  return panel;
}

async function showProfileDetail(name){
  const el = document.getElementById('profile-detail');
  fadeSwap(el, document.getElementById('profile-list'), document.getElementById('profile-item-detail'));
  el.innerHTML = '<p class="muted">불러오고 있어요...</p>';

  const setting = await getProfileSetting(name);
  profileCurrentSetting = setting;
  if(!(await canViewProfile(name, setting))){ renderLockedProfile(el, name); return; }

  const { data, error } = await sb.from('records').select('*').eq('name', name).order('date', { ascending: true });
  if(error){ el.innerHTML = `<p class="status err">${error.message}</p>`; return; }
  if(!data || data.length === 0){ el.innerHTML = '<p class="muted">기록이 없어요.</p>'; return; }

  const { data: keyLiftsData } = await sb.from('key_lifts').select('*').eq('name', name).order('lift_name', { ascending: true });

  profileCurrentData = data;
  profileCurrentName = name;
  profileCurrentKeyLifts = keyLiftsData || [];
  renderProfileBody(getPreferredUnit());
}

      header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;';

          <span class="muted">${records.length}회 기록</span>
          <span class="muted" style="display:flex;">${CHEVRON_ICON_SVG}</span>
        </span>`;

      const isWeightType = records.some(r => r.type === 'weight');
      const numericRecords = records.filter(r => !r.skipped && (r.type === 'weight' || r.type === 'reps'));
      const isNumeric = numericRecords.length > 0;
      itemCard.onclick = ()=> showProfileItemDetail(profileCurrentName, itemName, records, isWeightType, isNumeric);

      const recentList = document.createElement('div');
      recentList.style.marginBottom = '10px';
      const recent = records.slice().reverse().slice(0, 3);
      recent.forEach(r=>{
        const line = document.createElement('div');
        line.style.cssText = 'font-size:15px; margin-bottom:4px;';
        if(r.skipped){
          line.style.color = 'var(--text-muted)';
          line.innerHTML = `<span class="muted">${r.date}</span> — 생략${r.scale_detail ? ' ('+r.scale_detail.replace('생략: ','')+')' : ''}`;
        } else {
          const detailTag = personalDetailHtml(r, unit) ?? (r.scaled ? `<div style="margin-top:4px;"><span class="tag scaled">※${r.scale_detail ? ' '+r.scale_detail : ''}</span></div>` : '');

          line.innerHTML = `<span class="muted">${r.date}</span> — <strong style="font-weight:500;">${displayValue}</strong>${detailTag}`;
        }
        recentList.appendChild(line);
      });
      itemCard.appendChild(recentList);

      sectionGroup.appendChild(itemCard);
    });

    itemsContainer.appendChild(sectionGroup);
  });
}

function showProfileItemDetail(name, itemName, records, isWeightType, isNumeric){
  const el = document.getElementById('profile-item-detail');
  fadeSwap(el, document.getElementById('profile-list'), document.getElementById('profile-detail'));
  el.innerHTML = '';

  const unit = getPreferredUnit();

  const back = document.createElement('span');
  back.className = 'back-link';
  back.textContent = `← ${name} 프로필로`;
  back.onclick = ()=>{ el.classList.add('hidden'); showProfileDetail(name); };
  el.appendChild(back);

  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin:8px 0 16px;';
  titleRow.innerHTML = `<h2 style="font-size:20px; font-weight:500; margin:0;">${itemName}</h2><span class="muted">${records.length}회 기록</span>`;
  el.appendChild(titleRow);

  if(isNumeric){
    const graphToggleBtn = document.createElement('button');
    graphToggleBtn.textContent = '그래프 보기';
    graphToggleBtn.style.cssText = 'height:32px; font-size:15px; margin-bottom:12px;';
    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'hidden';
    canvasWrap.style.cssText = 'position:relative; width:100%; height:220px; margin-bottom:16px;';
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role','img');
    canvas.setAttribute('aria-label', `${itemName} 기록 추이 그래프`);
    canvasWrap.appendChild(canvas);

    let chartInstance = null;
    graphToggleBtn.onclick = ()=>{
      const isHidden = canvasWrap.classList.contains('hidden');
      if(!isHidden){
        canvasWrap.classList.add('hidden');
        graphToggleBtn.textContent = '그래프 보기';
        if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
        return;
      }
      canvasWrap.classList.remove('hidden');
      reveal(canvasWrap);
      graphToggleBtn.textContent = '그래프 숨기기';

      const numericRecords = records.filter(r => !r.skipped && (r.type === 'weight' || r.type === 'reps'));
      const chartData = numericRecords.map(r=>{
        const raw = parseFloat(r.value) || 0;
        const v = isWeightType ? fromKg(raw, unit) : raw;
        return Math.round(v * 10) / 10;
      });

      chartInstance = buildGlassLineChart(canvas, {
        labels: numericRecords.map(r=>r.date),
        data: chartData,
        label: itemName,
        suffix: isWeightType ? unit : ''
      });
    };
    el.appendChild(graphToggleBtn);
    el.appendChild(canvasWrap);
  }

  const list = document.createElement('div');
  records.slice().reverse().forEach(r=>{
    const line = document.createElement('div');
    line.style.cssText = 'font-size:15px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;';

    const textSpan = document.createElement('span');
    if(r.skipped){
      textSpan.style.color = 'var(--text-muted)';
      textSpan.innerHTML = `<span class="muted">${r.date}</span> — 생략${r.scale_detail ? ' ('+r.scale_detail.replace('생략: ','')+')' : ''}`;
    } else {
      const detailTag = personalDetailHtml(r, unit) ?? (r.scaled ? `<div style="margin-top:4px;"><span class="tag scaled">※${r.scale_detail ? ' '+r.scale_detail : ''}</span></div>` : '');
      const displayValue = r.type === 'weight' ? formatWeight(parseFloat(r.value) || 0, unit) : r.value;
      textSpan.innerHTML = `<span class="muted">${r.date}</span> — <strong style="font-weight:500;">${displayValue}</strong>${detailTag}`;
    }

    const editBtn = document.createElement('button');
    editBtn.title = '수정'; editBtn.setAttribute('aria-label', '수정');
    editBtn.style.cssText = `width:28px; height:28px; ${ICON_BTN_STYLE} border-radius:var(--radius); flex-shrink:0;`;
    editBtn.innerHTML = PENCIL_ICON_SVG;
    editBtn.onclick = ()=> startEditRecord(r, line, textSpan, unit, ()=> showProfileItemDetail(name, itemName, records, isWeightType, isNumeric), ()=>{
      const updated = records.filter(rec => rec.id !== r.id);
      if(updated.length === 0){ showProfileDetail(name); } else { showProfileItemDetail(name, itemName, updated, isWeightType, isNumeric); }
    });

    line.appendChild(textSpan);
    line.appendChild(editBtn);
    list.appendChild(line);
  });
  el.appendChild(list);
}

function round1(n){ return Math.round(n * 10) / 10; }

function formatBothUnits(kgValue, primaryUnit){
  const primary = primaryUnit || getPreferredUnit();
  const other = primary === 'lb' ? 'kg' : 'lb';
  return `${formatWeight(kgValue, primary)} (${formatWeight(kgValue, other)})`;
}

// 박스에 있는 바벨/원판 목록 (바벨은 미국식 45lb/35lb가 실제 정확한 무게 기준)
const BAR_INVENTORY = [
  { key: '45lb', label: '45lb', kg: 45 * KG_PER_LB },
  { key: '20kg', label: '20kg', kg: 20 },
  { key: '35lb', label: '35lb', kg: 35 * KG_PER_LB },
  { key: '15kg', label: '15kg', kg: 15 }
];
const PLATE_INVENTORY = [
  { label: '45lb', kg: 45 * KG_PER_LB, unit: 'lb' },
  { label: '35lb', kg: 35 * KG_PER_LB, unit: 'lb' },
  { label: '25lb', kg: 25 * KG_PER_LB, unit: 'lb' },
  { label: '15lb', kg: 15 * KG_PER_LB, unit: 'lb' },
  { label: '10lb', kg: 10 * KG_PER_LB, unit: 'lb' },
  { label: '25kg', kg: 25, unit: 'kg' },
  { label: '20kg', kg: 20, unit: 'kg' },
  { label: '15kg', kg: 15, unit: 'kg' },
  { label: '10kg', kg: 10, unit: 'kg' },
  { label: '5kg', kg: 5, unit: 'kg' },
  { label: '2.5kg', kg: 2.5, unit: 'kg' },
  { label: '2kg', kg: 2, unit: 'kg' },
  { label: '1.5kg', kg: 1.5, unit: 'kg' },
  { label: '1kg', kg: 1, unit: 'kg' },
  { label: '0.5kg', kg: 0.5, unit: 'kg' }
].sort((a,b)=> b.kg - a.kg);

// 목표 무게(kg), 바벨 무게(kg)를 받아 한쪽에 꽂을 원판 조합을 계산 (원판은 넉넉히 있다고 가정)
// 그램 단위 동적계획법으로, 목표를 살짝 넘기더라도(반올림 오차 보정) 가장 근접한 조합을 찾는다
function calcPlatesForWeight(targetKg, barKg){
  const perSideKg = Math.max((targetKg - barKg) / 2, 0);
  const targetGrams = Math.round(perSideKg * 1000);

  if(targetGrams <= 0){
    return { used: [], achievedTotalKg: barKg, perSideTarget: perSideKg, diffPerSideKg: -perSideKg };
  }

  // 1단계: lb 원판만으로 최선의 조합을 찾아요 (실제로 주로 쓰는 원판).
  const lbPlates = PLATE_INVENTORY.filter(p=> p.unit === 'lb');
  const lbDenoms = lbPlates.map(p=>({ label: p.label, grams: Math.round(p.kg * 1000) }));
  const lbBuffer = Math.max(...lbDenoms.map(d=>d.grams));
  const lbSearchMax = targetGrams + lbBuffer;

  const INF = Infinity;
  const minCount = new Array(lbSearchMax + 1).fill(INF);
  const chosen = new Array(lbSearchMax + 1).fill(-1);
  minCount[0] = 0;

  for(let s = 1; s <= lbSearchMax; s++){
    for(let i = 0; i < lbDenoms.length; i++){
      const g = lbDenoms[i].grams;
      if(g <= s && minCount[s - g] + 1 < minCount[s]){
        minCount[s] = minCount[s - g] + 1;
        chosen[s] = i;
      }
    }
  }

  let bestS = -1;
  let bestDiff = Infinity;
  const lbSearchMin = Math.max(0, targetGrams - lbBuffer);
  for(let s = lbSearchMin; s <= lbSearchMax; s++){
    if(minCount[s] === INF) continue;
    const diff = Math.abs(s - targetGrams);
    if(diff < bestDiff - 1e-9){
      bestDiff = diff;
      bestS = s;
    } else if(Math.abs(diff - bestDiff) <= 1e-9 && bestS !== -1){
      const currentBetter = (s <= targetGrams && bestS > targetGrams) ||
        ((s <= targetGrams) === (bestS <= targetGrams) && minCount[s] < minCount[bestS]);
      if(currentBetter){ bestS = s; }
    }
  }
  if(bestS === -1) bestS = 0;

  const countMap = {};
  let s = bestS;
  while(s > 0){
    const idx = chosen[s];
    if(idx === -1) break;
    countMap[lbDenoms[idx].label] = (countMap[lbDenoms[idx].label] || 0) + 1;
    s -= lbDenoms[idx].grams;
  }

  // 2단계: 남는 오차를 작은 kg 원판(5kg 이하) 최대 2장으로만 정밀 보정해요.
  // (많이 섞으면 실제로 꽂기 번거로우니 미세 조정 용도로만 최소한으로 사용)
  const smallKgPlates = PLATE_INVENTORY.filter(p=> p.unit === 'kg' && p.kg <= 5);
  let bestTotal = bestS;
  let bestExtra = [];
  let bestExtraDiff = Math.abs(bestS - targetGrams);

  const tryCombo = (combo)=>{
    const extraGrams = combo.reduce((sum, p)=> sum + Math.round(p.kg * 1000), 0);
    const total = bestS + extraGrams;
    const diff = Math.abs(total - targetGrams);
    const better = diff < bestExtraDiff - 1e-9 ||
      (Math.abs(diff - bestExtraDiff) <= 1e-9 && combo.length < bestExtra.length);
    if(better){
      bestExtraDiff = diff;
      bestTotal = total;
      bestExtra = combo;
    }
  };

  smallKgPlates.forEach(p=> tryCombo([p]));
  smallKgPlates.forEach((p, i)=>{
    smallKgPlates.slice(i).forEach(q=> tryCombo([p, q]));
  });

  bestExtra.forEach(p=>{ countMap[p.label] = (countMap[p.label] || 0) + 1; });

  const allPlates = [...lbPlates, ...smallKgPlates];
  const used = allPlates
    .filter(p=> countMap[p.label])
    .map(p=> ({ label: p.label, count: countMap[p.label] }));

  const achievedPerSideKg = bestTotal / 1000;
  const achievedTotalKg = barKg + achievedPerSideKg * 2;
  const diffPerSideKg = perSideKg - achievedPerSideKg; // 양수: 목표에 못 미침, 음수: 목표를 초과

  return { used, achievedTotalKg, perSideTarget: perSideKg, diffPerSideKg };
}

// 한쪽에 꽂는 원판 구성을 실제 바벨처럼 그림으로 보여줘요. 바에서 가까운 쪽이 큰 원판.
function buildBarbellVisual(used){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:2px; margin:10px 0; padding:10px 4px; overflow-x:auto;';

  const plates = [];
  used.forEach(p=>{
    const m = p.label.match(/^([\d.]+)(lb|kg)$/);
    const num = m ? parseFloat(m[1]) : parseFloat(p.label);
    const unit = m ? m[2] : 'lb';
    for(let i = 0; i < p.count; i++) plates.push({ num, unit });
  });

  if(plates.length === 0){
    const empty = document.createElement('p');
    empty.className = 'muted';
    empty.style.cssText = 'font-size:13px; text-align:center; width:100%;';
    empty.textContent = '추가 원판 없이 바벨만 사용해요';
    wrap.appendChild(empty);
    return wrap;
  }

  function plateEl(plate){
    // kg 원판은 lb 환산 무게 기준으로 높이를 잡아서 실제 크기 느낌이 나게 해요.
    const equivLb = plate.unit === 'kg' ? plate.num / KG_PER_LB : plate.num;
    const h = Math.round(26 + Math.min(equivLb, 45) / 45 * 42);
    const el = document.createElement('div');
    el.style.cssText = `position:relative; display:flex; align-items:center; justify-content:center;
      min-width:24px; height:${h}px; flex-shrink:0; margin:0 1px; padding:0 3px;
      border-radius:3px; background:var(--surface-1); border:1px solid var(--border-strong);
      box-shadow: var(--card-shadow);`;
    const label = document.createElement('span');
    label.textContent = plate.unit === 'kg' ? `${plate.num}kg` : plate.num;
    label.style.cssText = `font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); white-space:nowrap;`;
    el.appendChild(label);
    return el;
  }

  plates.forEach(p=> wrap.appendChild(plateEl(p)));

  return wrap;
}
