  titleRow.appendChild(unitWrap);
  el.appendChild(titleRow);

  document.getElementById('profile-unit-select').onchange = (e)=>{
    setPreferredUnit(e.target.value);
    renderProfileBody(e.target.value);
  };

  // ---------- 주요 리프트 기록 ----------
  const keyLiftsBox = document.createElement('div');
  keyLiftsBox.style.cssText = 'background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:20px; box-shadow:var(--card-shadow);';
  const kEyebrow = document.createElement('p');
  kEyebrow.className = 'eyebrow';
  kEyebrow.textContent = 'PERFORMANCE';
  keyLiftsBox.appendChild(kEyebrow);
  const kTitle = document.createElement('h3');
  kTitle.style.cssText = 'font-size:18px; font-weight:500; margin:0 0 12px;';
  kTitle.textContent = '주요 리프트 기록';
  keyLiftsBox.appendChild(kTitle);

  const defaultLiftNames = ['백스쿼트','프론트스쿼트','데드리프트','숄더프레스','클린','스내치'];
  const existingNames = profileCurrentKeyLifts.map(k=>k.lift_name);
  const allLiftNames = [...new Set([...defaultLiftNames, ...existingNames])];

  const kGrid = document.createElement('div');
  kGrid.style.cssText = 'display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;';

  // 타일을 누르면 아래 상세 패널에서 기록추가/그래프/삭제를 할 수 있어요
  const liftDetailPanel = document.createElement('div');
  liftDetailPanel.className = 'hidden';
  liftDetailPanel.style.cssText = 'margin-top:12px; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px;';

  function renderLiftDetail(liftName){
    const found = profileCurrentKeyLifts.find(k=>k.lift_name === liftName);
    if(keyLiftChartInstances['panel']){ keyLiftChartInstances['panel'].destroy(); delete keyLiftChartInstances['panel']; }
    liftDetailPanel.classList.remove('hidden');
    reveal(liftDetailPanel);
    liftDetailPanel.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
        <span style="font-weight:500; font-size:17px;">${liftName}</span>
        <span class="mono" style="font-size:19px; font-weight:500;">${found ? formatWeight(found.value_kg, unit) : '기록 없음'}</span>
      </div>
      <div class="row" style="gap:8px; margin-bottom:0;">
        <button type="button" id="lift-detail-add" title="기록 추가" aria-label="기록 추가" style="height:36px; flex:1; ${ICON_BTN_STYLE} border-radius:var(--radius);">${PLUS_ICON_SVG}</button>
        ${found ? `<button type="button" id="lift-detail-graph" title="그래프 보기" aria-label="그래프 보기" style="height:36px; flex:1; ${ICON_BTN_STYLE} border-radius:var(--radius);">${CHART_ICON_SVG}</button>` : ''}
        ${found ? `<button type="button" id="lift-detail-del" title="삭제" aria-label="삭제" style="height:36px; flex:1; ${ICON_BTN_DANGER_STYLE} border-radius:var(--radius);">${TRASH_ICON_SVG}</button>` : ''}
      </div>
      <div class="key-lift-chart-wrap hidden" style="position:relative; width:100%; height:180px; margin-top:12px;">
        <canvas id="key-lift-chart-panel" role="img" aria-label="${liftName} 기록 추이 그래프"></canvas>
      </div>
    `;
    liftDetailPanel.querySelector('#lift-detail-add').onclick = ()=> editKeyLift(name, liftName, found, unit);
    const graphBtn = liftDetailPanel.querySelector('#lift-detail-graph');
    if(graphBtn) graphBtn.onclick = ()=> toggleKeyLiftGraph(name, liftName, 'panel', unit, liftDetailPanel);
    const delBtn = liftDetailPanel.querySelector('#lift-detail-del');
    if(delBtn) delBtn.onclick = ()=> clearKeyLift(name, liftName, found);

    kGrid.querySelectorAll('[data-lift]').forEach(t=>{
      t.style.boxShadow = t.dataset.lift === liftName ? 'inset 0 0 0 2px var(--text-primary)' : 'none';
    });
  }

  allLiftNames.forEach((liftName)=>{
    const found = profileCurrentKeyLifts.find(k=>k.lift_name === liftName);
    const tile = document.createElement('div');
    tile.dataset.lift = liftName;
    tile.style.cssText = 'background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px; cursor:pointer; min-width:0;';
    tile.innerHTML = `
      <p class="muted" style="margin:0 0 2px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${liftName}</p>
      <p class="mono" style="font-weight:500; font-size:16px; margin:0; white-space:nowrap;">${found ? formatWeight(found.value_kg, unit) : '—'}</p>
    `;
    tile.onclick = ()=> renderLiftDetail(liftName);
    kGrid.appendChild(tile);
  });
  keyLiftsBox.appendChild(kGrid);
  keyLiftsBox.appendChild(liftDetailPanel);

  const addLiftToggleBtn = document.createElement('button');
  addLiftToggleBtn.textContent = '종목 추가';
  addLiftToggleBtn.style.cssText = 'margin-top:12px; width:100%; height:38px; font-size:15px;';
  keyLiftsBox.appendChild(addLiftToggleBtn);

  const addLiftForm = document.createElement('div');
  addLiftForm.className = 'hidden';
  addLiftForm.style.cssText = 'margin-top:10px; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:12px;';
  addLiftForm.innerHTML = `
    <input type="text" id="new-lift-name" placeholder="종목 이름 (예: 벤치프레스)" style="width:100%; margin-bottom:8px;" />
    <div class="row" style="margin-bottom:8px;">
      <input type="number" step="0.1" id="new-lift-value" placeholder="무게" style="width:100px;" />
      <select id="new-lift-unit" style="width:80px;">
        <option value="lb" ${unit==='lb'?'selected':''}>lb</option>
        <option value="kg" ${unit==='kg'?'selected':''}>kg</option>
      </select>
      <input type="date" id="new-lift-date" style="width:150px;" />
    </div>
    <div class="row" style="margin-bottom:0;">
      <button type="button" id="new-lift-save-btn" class="primary" style="height:34px; font-size:15px; flex:1;">저장</button>
      <button type="button" id="new-lift-cancel-btn" style="height:34px; font-size:15px; flex:1;">취소</button>
    </div>
  `;
  keyLiftsBox.appendChild(addLiftForm);
  el.appendChild(keyLiftsBox);

  addLiftToggleBtn.onclick = ()=>{
    const willShow = addLiftForm.classList.contains('hidden');
    revealToggle(addLiftForm, willShow);
    if(willShow){
      addLiftForm.querySelector('#new-lift-date').value = todayStr();
      addLiftForm.querySelector('#new-lift-name').focus();
    }
  };
  addLiftForm.querySelector('#new-lift-cancel-btn').onclick = ()=> addLiftForm.classList.add('hidden');
  addLiftForm.querySelector('#new-lift-save-btn').onclick = async ()=>{
    const newName = addLiftForm.querySelector('#new-lift-name').value.trim();
    const rawValue = addLiftForm.querySelector('#new-lift-value').value;
    const valUnit = addLiftForm.querySelector('#new-lift-unit').value;
    const recordedDate = addLiftForm.querySelector('#new-lift-date').value || todayStr();
    if(!newName){ alert('종목 이름을 입력해주세요'); return; }
    const num = parseFloat(rawValue);
    if(isNaN(num)){ alert('무게를 입력해주세요'); return; }
    const kgValue = Math.round(toKg(num, valUnit) * 100) / 100;
    setPreferredUnit(valUnit);
    const ok = await saveKeyLiftValue(name, newName, kgValue, recordedDate);
    if(ok) showProfileDetail(name);
  };

  // ---------- 날짜별 기록 보기 ----------
  el.appendChild(buildDateLookupBox(data, unit));

  // ---------- 기록 검색 ----------
  const searchBox = document.createElement('div');
  searchBox.style.marginBottom = '16px';
  searchBox.innerHTML = `<label>기록 검색 (동작 이름으로 검색)</label><input type="text" id="profile-search" placeholder="예: 스쿼트, EMOM, DU 등" style="width:100%;" />`;
  el.appendChild(searchBox);
  document.getElementById('profile-search').oninput = (e)=>{
    filterProfileItemSections(e.target.value.trim().toLowerCase());
  };

  const itemsContainer = document.createElement('div');
  itemsContainer.id = 'profile-items-container';
  el.appendChild(itemsContainer);

  const byItem = {};
  data.forEach(r=>{
    if(!byItem[r.item_name]) byItem[r.item_name] = [];
    byItem[r.item_name].push(r);
  });

  Object.entries(byItem).forEach(([itemName, records], i)=>{
    const section = document.createElement('div');
    section.className = 'card';
    section.dataset.itemName = itemName.toLowerCase();
    section.style.cursor = 'pointer';

    const header = document.createElement('div');
    header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;';
    header.innerHTML = `<span class="item-name">${itemName}</span>
      <span style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
        <span class="muted">${records.length}회 기록</span>
        <span class="muted" style="display:flex;">${CHEVRON_ICON_SVG}</span>
      </span>`;
    section.appendChild(header);

    const isWeightType = records.some(r => r.type === 'weight');
    const numericRecords = records.filter(r => !r.skipped && (r.type === 'weight' || r.type === 'reps'));
    const isNumeric = numericRecords.length > 0;
    section.onclick = ()=> showProfileItemDetail(profileCurrentName, itemName, records, isWeightType, isNumeric);

    const recentList = document.createElement('div');
    recentList.style.marginBottom = '10px';
    const recent = records.slice().reverse().slice(0, 3);
    recent.forEach(r=>{
      const line = document.createElement('div');
      line.style.cssText = 'font-size:15px; margin-bottom:4px;';
      if(r.skipped){
        line.style.color = 'var(--text-muted)';
        line.innerHTML = `<span class="muted">${r.date}</span> — 생략${r.scale_detail ? ' ('+r.scale_detail.replace('생략: ','')+')' : ''}`;
      } else {
        const detailTag = r.scaled ? `<div style="margin-top:4px;"><span class="tag scaled">※${r.scale_detail ? ' '+r.scale_detail : ''}</span></div>` : '';
        const displayValue = r.type === 'weight' ? formatWeight(parseFloat(r.value) || 0, unit) : r.value;
        line.innerHTML = `<span class="muted">${r.date}</span> — <strong style="font-weight:500;">${displayValue}</strong>${detailTag}`;
      }
      recentList.appendChild(line);
    });
    section.appendChild(recentList);

    itemsContainer.appendChild(section);
  });
}

function showProfileItemDetail(name, itemName, records, isWeightType, isNumeric){
  const el = document.getElementById('profile-item-detail');
  fadeSwap(el, document.getElementById('profile-list'), document.getElementById('profile-detail'));
  el.innerHTML = '';

  const unit = getPreferredUnit();

  const back = document.createElement('span');
  back.className = 'back-link';
  back.textContent = `← ${name} 프로필로`;
  back.onclick = ()=>{ el.classList.add('hidden'); showProfileDetail(name); };
  el.appendChild(back);

  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin:8px 0 16px;';
  titleRow.innerHTML = `<h2 style="font-size:20px; font-weight:500; margin:0;">${itemName}</h2><span class="muted">${records.length}회 기록</span>`;
  el.appendChild(titleRow);

  if(isNumeric){
    const graphToggleBtn = document.createElement('button');
    graphToggleBtn.textContent = '그래프 보기';
    graphToggleBtn.style.cssText = 'height:32px; font-size:15px; margin-bottom:12px;';
    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'hidden';
    canvasWrap.style.cssText = 'position:relative; width:100%; height:220px; margin-bottom:16px;';
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role','img');
    canvas.setAttribute('aria-label', `${itemName} 기록 추이 그래프`);
    canvasWrap.appendChild(canvas);

    let chartInstance = null;
    graphToggleBtn.onclick = ()=>{
      const isHidden = canvasWrap.classList.contains('hidden');
      if(!isHidden){
        canvasWrap.classList.add('hidden');
        graphToggleBtn.textContent = '그래프 보기';
        if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
        return;
      }
      canvasWrap.classList.remove('hidden');
      reveal(canvasWrap);
      graphToggleBtn.textContent = '그래프 숨기기';

      const numericRecords = records.filter(r => !r.skipped && (r.type === 'weight' || r.type === 'reps'));
      const chartData = numericRecords.map(r=>{
        const raw = parseFloat(r.value) || 0;
        const v = isWeightType ? fromKg(raw, unit) : raw;
        return Math.round(v * 10) / 10;
      });

      chartInstance = buildGlassLineChart(canvas, {
        labels: numericRecords.map(r=>r.date),
        data: chartData,
        label: itemName,
        suffix: isWeightType ? unit : ''
      });
    };
    el.appendChild(graphToggleBtn);
    el.appendChild(canvasWrap);
  }

  const list = document.createElement('div');
  records.slice().reverse().forEach(r=>{
    const line = document.createElement('div');
    line.style.cssText = 'font-size:15px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;';

    const textSpan = document.createElement('span');
    if(r.skipped){
      textSpan.style.color = 'var(--text-muted)';
      textSpan.innerHTML = `<span class="muted">${r.date}</span> — 생략${r.scale_detail ? ' ('+r.scale_detail.replace('생략: ','')+')' : ''}`;
    } else {
      const detailTag = r.scaled ? `<div style="margin-top:4px;"><span class="tag scaled">※${r.scale_detail ? ' '+r.scale_detail : ''}</span></div>` : '';
      const displayValue = r.type === 'weight' ? formatWeight(parseFloat(r.value) || 0, unit) : r.value;
      textSpan.innerHTML = `<span class="muted">${r.date}</span> — <strong style="font-weight:500;">${displayValue}</strong>${detailTag}`;
    }

    const editBtn = document.createElement('button');
    editBtn.title = '수정'; editBtn.setAttribute('aria-label', '수정');
    editBtn.style.cssText = `width:28px; height:28px; ${ICON_BTN_STYLE} border-radius:var(--radius); flex-shrink:0;`;
    editBtn.innerHTML = PENCIL_ICON_SVG;
    editBtn.onclick = ()=> startEditRecord(r, line, textSpan, unit, ()=> showProfileItemDetail(name, itemName, records, isWeightType, isNumeric), ()=>{
      const updated = records.filter(rec => rec.id !== r.id);
      if(updated.length === 0){ showProfileDetail(name); } else { showProfileItemDetail(name, itemName, updated, isWeightType, isNumeric); }
    });

    line.appendChild(textSpan);
    line.appendChild(editBtn);
    list.appendChild(line);
  });
  el.appendChild(list);
}

function round1(n){ return Math.round(n * 10) / 10; }

function formatBothUnits(kgValue, primaryUnit){
  const primary = primaryUnit || getPreferredUnit();
  const other = primary === 'lb' ? 'kg' : 'lb';
  return `${formatWeight(kgValue, primary)} (${formatWeight(kgValue, other)})`;
}

// 박스에 있는 바벨/원판 목록 (바벨은 미국식 45lb/35lb가 실제 정확한 무게 기준)
const BAR_INVENTORY = [
  { key: '45lb', label: '45lb', kg: 45 * KG_PER_LB },
  { key: '20kg', label: '20kg', kg: 20 },
  { key: '35lb', label: '35lb', kg: 35 * KG_PER_LB },
  { key: '15kg', label: '15kg', kg: 15 }
];
const PLATE_INVENTORY = [
  { label: '45lb', kg: 45 * KG_PER_LB, unit: 'lb' },
  { label: '35lb', kg: 35 * KG_PER_LB, unit: 'lb' },
  { label: '25lb', kg: 25 * KG_PER_LB, unit: 'lb' },
  { label: '15lb', kg: 15 * KG_PER_LB, unit: 'lb' },
  { label: '10lb', kg: 10 * KG_PER_LB, unit: 'lb' },
  { label: '25kg', kg: 25, unit: 'kg' },
  { label: '20kg', kg: 20, unit: 'kg' },
  { label: '15kg', kg: 15, unit: 'kg' },
  { label: '10kg', kg: 10, unit: 'kg' },
  { label: '5kg', kg: 5, unit: 'kg' },
  { label: '2.5kg', kg: 2.5, unit: 'kg' },
  { label: '2kg', kg: 2, unit: 'kg' },
  { label: '1.5kg', kg: 1.5, unit: 'kg' },
  { label: '1kg', kg: 1, unit: 'kg' },
  { label: '0.5kg', kg: 0.5, unit: 'kg' }
].sort((a,b)=> b.kg - a.kg);

// 목표 무게(kg), 바벨 무게(kg)를 받아 한쪽에 꽂을 원판 조합을 계산 (원판은 넉넉히 있다고 가정)
// 그램 단위 동적계획법으로, 목표를 살짝 넘기더라도(반올림 오차 보정) 가장 근접한 조합을 찾는다
function calcPlatesForWeight(targetKg, barKg){
  const perSideKg = Math.max((targetKg - barKg) / 2, 0);
  const targetGrams = Math.round(perSideKg * 1000);

  if(targetGrams <= 0){
    return { used: [], achievedTotalKg: barKg, perSideTarget: perSideKg, diffPerSideKg: -perSideKg };
  }

  // 1단계: lb 원판만으로 최선의 조합을 찾아요 (실제로 주로 쓰는 원판).
  const lbPlates = PLATE_INVENTORY.filter(p=> p.unit === 'lb');
  const lbDenoms = lbPlates.map(p=>({ label: p.label, grams: Math.round(p.kg * 1000) }));
  const lbBuffer = Math.max(...lbDenoms.map(d=>d.grams));
  const lbSearchMax = targetGrams + lbBuffer;

  const INF = Infinity;
  const minCount = new Array(lbSearchMax + 1).fill(INF);
  const chosen = new Array(lbSearchMax + 1).fill(-1);
  minCount[0] = 0;

  for(let s = 1; s <= lbSearchMax; s++){
    for(let i = 0; i < lbDenoms.length; i++){
      const g = lbDenoms[i].grams;
      if(g <= s && minCount[s - g] + 1 < minCount[s]){
        minCount[s] = minCount[s - g] + 1;
        chosen[s] = i;
      }
    }
  }

  let bestS = -1;
  let bestDiff = Infinity;
  const lbSearchMin = Math.max(0, targetGrams - lbBuffer);
  for(let s = lbSearchMin; s <= lbSearchMax; s++){
    if(minCount[s] === INF) continue;
    const diff = Math.abs(s - targetGrams);
    if(diff < bestDiff - 1e-9){
      bestDiff = diff;
      bestS = s;
    } else if(Math.abs(diff - bestDiff) <= 1e-9 && bestS !== -1){
      const currentBetter = (s <= targetGrams && bestS > targetGrams) ||
        ((s <= targetGrams) === (bestS <= targetGrams) && minCount[s] < minCount[bestS]);
      if(currentBetter){ bestS = s; }
    }
  }
  if(bestS === -1) bestS = 0;

  const countMap = {};
  let s = bestS;
  while(s > 0){
    const idx = chosen[s];
    if(idx === -1) break;
    countMap[lbDenoms[idx].label] = (countMap[lbDenoms[idx].label] || 0) + 1;
    s -= lbDenoms[idx].grams;
  }

  // 2단계: 남는 오차를 작은 kg 원판(5kg 이하) 최대 2장으로만 정밀 보정해요.
  // (많이 섞으면 실제로 꽂기 번거로우니 미세 조정 용도로만 최소한으로 사용)
  const smallKgPlates = PLATE_INVENTORY.filter(p=> p.unit === 'kg' && p.kg <= 5);
  let bestTotal = bestS;
  let bestExtra = [];
  let bestExtraDiff = Math.abs(bestS - targetGrams);

  const tryCombo = (combo)=>{
    const extraGrams = combo.reduce((sum, p)=> sum + Math.round(p.kg * 1000), 0);
    const total = bestS + extraGrams;
    const diff = Math.abs(total - targetGrams);
    const better = diff < bestExtraDiff - 1e-9 ||
      (Math.abs(diff - bestExtraDiff) <= 1e-9 && combo.length < bestExtra.length);
    if(better){
      bestExtraDiff = diff;
      bestTotal = total;
      bestExtra = combo;
    }
  };

  smallKgPlates.forEach(p=> tryCombo([p]));
  smallKgPlates.forEach((p, i)=>{
    smallKgPlates.slice(i).forEach(q=> tryCombo([p, q]));
  });

  bestExtra.forEach(p=>{ countMap[p.label] = (countMap[p.label] || 0) + 1; });

  const allPlates = [...lbPlates, ...smallKgPlates];
  const used = allPlates
    .filter(p=> countMap[p.label])
    .map(p=> ({ label: p.label, count: countMap[p.label] }));

  const achievedPerSideKg = bestTotal / 1000;
  const achievedTotalKg = barKg + achievedPerSideKg * 2;
  const diffPerSideKg = perSideKg - achievedPerSideKg; // 양수: 목표에 못 미침, 음수: 목표를 초과

  return { used, achievedTotalKg, perSideTarget: perSideKg, diffPerSideKg };
}

// 한쪽에 꽂는 원판 구성을 실제 바벨처럼 그림으로 보여줘요. 바에서 가까운 쪽이 큰 원판.
function buildBarbellVisual(used){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:2px; margin:10px 0; padding:10px 4px; overflow-x:auto;';

  const plates = [];
  used.forEach(p=>{
    const m = p.label.match(/^([\d.]+)(lb|kg)$/);
    const num = m ? parseFloat(m[1]) : parseFloat(p.label);
    const unit = m ? m[2] : 'lb';
    for(let i = 0; i < p.count; i++) plates.push({ num, unit });
  });

  if(plates.length === 0){
    const empty = document.createElement('p');
    empty.className = 'muted';
    empty.style.cssText = 'font-size:13px; text-align:center; width:100%;';
    empty.textContent = '추가 원판 없이 바벨만 사용해요';
    wrap.appendChild(empty);
    return wrap;
  }

  function plateEl(plate){
    // kg 원판은 lb 환산 무게 기준으로 높이를 잡아서 실제 크기 느낌이 나게 해요.
    const equivLb = plate.unit === 'kg' ? plate.num / KG_PER_LB : plate.num;
    const h = Math.round(26 + Math.min(equivLb, 45) / 45 * 42);
    const el = document.createElement('div');
    el.style.cssText = `position:relative; display:flex; align-items:center; justify-content:center;
      min-width:24px; height:${h}px; flex-shrink:0; margin:0 1px; padding:0 3px;
      border-radius:3px; background:var(--surface-1); border:1px solid var(--border-strong);
      box-shadow: var(--card-shadow);`;
    const label = document.createElement('span');
    label.textContent = plate.unit === 'kg' ? `${plate.num}kg` : plate.num;
    label.style.cssText = `font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); white-space:nowrap;`;
    el.appendChild(label);
    return el;
  }

  plates.forEach(p=> wrap.appendChild(plateEl(p)));

  return wrap;
}

// 오른쪽 아래에 항상 떠있는 계산기 아이콘. 눌러서 열고 닫으며 무게 계산기 패널을 확장/축소해요.
function initFloatingWeightCalc(){
  const unit = getPreferredUnit();

  const container = document.createElement('div');
  container.id = 'floating-calc';
  container.style.cssText = 'position:fixed; right:20px; bottom:20px; z-index:1000; display:flex; flex-direction:column; align-items:flex-end; gap:10px;';

  const panel = document.createElement('div');
  panel.style.cssText = 'width:min(360px, calc(100vw - 40px)); background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--card-shadow);';
  initCollapsible(panel);

  const panelInner = document.createElement('div');
  panelInner.style.cssText = 'padding:16px; max-height:min(60vh, 480px); overflow-y:auto;';
  panel.appendChild(panelInner);

  panelInner.innerHTML = `
    <p class="eyebrow" style="margin:0 0 6px;">CALCULATOR</p>
    <h3 style="font-size:18px; font-weight:500; margin:0 0 14px;">무게 계산기</h3>

    <div class="row" style="margin-bottom:16px;">
      <label style="margin:0; font-size:15px;">기준 무게</label>
      <input type="number" step="0.1" id="calc-base-value" placeholder="무게" style="width:110px;" />
      <select id="calc-base-unit" style="width:80px;">
        <option value="lb" ${unit==='lb'?'selected':''}>lb</option>
        <option value="kg" ${unit==='kg'?'selected':''}>kg</option>
      </select>
    </div>

    <p class="muted" style="margin:0 0 8px; font-weight:500;">퍼센트 계산</p>
    <div class="row" id="calc-percent-presets" style="margin-bottom:8px;"></div>
    <div class="row" style="margin-bottom:6px;">
      <input type="number" id="calc-custom-percent" placeholder="직접입력 %" style="width:110px;" />
      <button id="calc-custom-percent-btn" style="height:32px; font-size:15px;">계산</button>
    </div>
    <p id="calc-percent-result" style="font-size:17px; font-weight:500; margin:8px 0 18px; min-height:20px;"></p>

    <p class="muted" style="margin:0 0 8px; font-weight:500;">단계별 증량</p>
    <div id="calc-steps-list" style="margin-bottom:8px;"></div>
    <div class="row">
      <input type="number" step="0.1" id="calc-step-amount" placeholder="증량" style="width:90px;" />
      <select id="calc-step-unit" style="width:80px;">
        <option value="lb" ${unit==='lb'?'selected':''}>lb</option>
        <option value="kg" ${unit==='kg'?'selected':''}>kg</option>
      </select>
      <button id="calc-step-add-btn" style="height:32px; font-size:15px;">단계 추가</button>
      <button id="calc-step-reset-btn" style="height:32px; font-size:15px;">초기화</button>
    </div>

    <p class="muted" style="margin:18px 0 8px; font-weight:500;">바벨 플레이트 계산</p>
    <p class="muted" style="font-size:14px; margin:0 0 8px;">위 "기준 무게"를 목표 무게로 사용해요.</p>
    <div class="row" style="margin-bottom:10px;">
      <label style="margin:0; font-size:15px;">바벨</label>
      <select id="calc-bar-select" style="width:180px;">
        ${BAR_INVENTORY.map(b=>`<option value="${b.key}">${b.label}</option>`).join('')}
      </select>
    </div>
    <div id="calc-plate-result"></div>
  `;
  container.appendChild(panel);

  const toggleBtn = document.createElement('button');
  toggleBtn.title = '무게 계산기 열기';
  toggleBtn.setAttribute('aria-label', '무게 계산기 열기');
  toggleBtn.style.cssText = `width:52px; height:52px; ${ICON_BTN_STYLE}`;
  toggleBtn.innerHTML = CALCULATOR_ICON_SVG;
  toggleBtn.querySelector('svg').setAttribute('width', '22');
  toggleBtn.querySelector('svg').setAttribute('height', '22');
  container.appendChild(toggleBtn);

  document.body.appendChild(container);

  toggleBtn.onclick = ()=>{
    const isOpen = panel.classList.contains('open');
    toggleCollapsible(panel, !isOpen);
    if(!isOpen){
      toggleBtn.innerHTML = CLOSE_ICON_SVG;
      toggleBtn.title = '무게 계산기 닫기'; toggleBtn.setAttribute('aria-label', '무게 계산기 닫기');
      toggleBtn.style.color = 'var(--text-danger)';
    } else {
      toggleBtn.innerHTML = CALCULATOR_ICON_SVG;
      toggleBtn.title = '무게 계산기 열기'; toggleBtn.setAttribute('aria-label', '무게 계산기 열기');
      toggleBtn.style.color = 'var(--text-primary)';
    }
    toggleBtn.querySelector('svg').setAttribute('width', '22');
    toggleBtn.querySelector('svg').setAttribute('height', '22');
  };

  const baseValueInput = panelInner.querySelector('#calc-base-value');
  const baseUnitSelect = panelInner.querySelector('#calc-base-unit');

  function getBaseKg(){
    const v = parseFloat(baseValueInput.value);
    if(isNaN(v)) return null;
    return toKg(v, baseUnitSelect.value);
  }

  // 퍼센트 프리셋 버튼
  const presetWrap = panelInner.querySelector('#calc-percent-presets');
  [50,60,65,70,75,80,85,90,95].forEach(pct=>{
    const btn = document.createElement('button');
    btn.textContent = `${pct}%`;
    btn.style.cssText = 'height:30px; font-size:14px; padding:0 10px;';
    btn.onclick = ()=> showPercentResult(pct);
    presetWrap.appendChild(btn);
  });

  const percentResultEl = panelInner.querySelector('#calc-percent-result');
  function showPercentResult(pct){
    const baseKg = getBaseKg();
    if(baseKg === null){ percentResultEl.textContent = '기준 무게를 먼저 입력해주세요'; return; }
    const resultKg = baseKg * (pct / 100);
    percentResultEl.textContent = `${pct}% = ${formatBothUnits(resultKg, baseUnitSelect.value)}`;
  }

  panelInner.querySelector('#calc-custom-percent-btn').onclick = ()=>{
    const pct = parseFloat(panelInner.querySelector('#calc-custom-percent').value);
    if(isNaN(pct)){ percentResultEl.textContent = '퍼센트를 입력해주세요'; return; }
    showPercentResult(pct);
  };

  // 단계별 증량 계산
  let calcSteps = [];
  const stepsListEl = panelInner.querySelector('#calc-steps-list');

  function renderSteps(){
    stepsListEl.innerHTML = '';
    const baseKg = getBaseKg();
    if(baseKg === null){
      stepsListEl.innerHTML = '<p class="muted" style="font-size:14px;">기준 무게를 먼저 입력해주세요</p>';
      return;
    }
    const startLine = document.createElement('p');
    startLine.style.cssText = 'font-size:15px; margin:0 0 6px;';
    startLine.innerHTML = `시작: <strong style="font-weight:500;">${formatBothUnits(baseKg, baseUnitSelect.value)}</strong>`;
    stepsListEl.appendChild(startLine);

    let runningKg = baseKg;
    calcSteps.forEach((step, i)=>{
      const incKg = toKg(step.amount, step.unit);
      runningKg += incKg;
      const otherUnit = step.unit === 'lb' ? 'kg' : 'lb';
      const line = document.createElement('div');
      line.style.cssText = 'display:flex; justify-content:space-between; align-items:center; font-size:15px; margin-bottom:4px; gap:8px;';
      line.innerHTML = `<span>${i+1}단계: +${step.amount}${step.unit} (${round1(fromKg(incKg, otherUnit))}${otherUnit}) → <strong style="font-weight:500;">${formatBothUnits(runningKg, baseUnitSelect.value)}</strong></span>`;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '삭제';
      removeBtn.style.cssText = 'height:24px; font-size:13px; padding:0 8px; flex-shrink:0;';
      removeBtn.onclick = ()=>{ calcSteps.splice(i,1); renderSteps(); };
      line.appendChild(removeBtn);
      stepsListEl.appendChild(line);
    });
  }

  panelInner.querySelector('#calc-step-add-btn').onclick = ()=>{
    const amount = parseFloat(panelInner.querySelector('#calc-step-amount').value);
    if(isNaN(amount)){ alert('증량 값을 입력해주세요'); return; }
    const stepUnit = panelInner.querySelector('#calc-step-unit').value;
    calcSteps.push({ amount, unit: stepUnit });
    panelInner.querySelector('#calc-step-amount').value = '';
    renderSteps();
  };
  panelInner.querySelector('#calc-step-reset-btn').onclick = ()=>{ calcSteps = []; renderSteps(); };

  // 바벨 플레이트 계산
  const barSelect = panelInner.querySelector('#calc-bar-select');
  const plateResultEl = panelInner.querySelector('#calc-plate-result');

  function renderPlateCalc(){
    const baseKg = getBaseKg();
    if(baseKg === null){
      plateResultEl.innerHTML = '<p class="muted" style="font-size:14px;">기준 무게를 먼저 입력해주세요</p>';
      return;
    }
    const bar = BAR_INVENTORY.find(b=>b.key === barSelect.value);
    if(baseKg < bar.kg - 0.05){
      plateResultEl.innerHTML = `<p class="muted" style="font-size:14px;">기준 무게가 바벨 무게(${formatBothUnits(bar.kg, baseUnitSelect.value)})보다 가벼워요</p>`;
      return;
    }

    const { used, achievedTotalKg, diffPerSideKg } = calcPlatesForWeight(baseKg, bar.kg);

    plateResultEl.innerHTML = '';
    plateResultEl.appendChild(buildBarbellVisual(used));

    const totalLine = document.createElement('p');
    totalLine.style.cssText = 'font-size:17px; font-weight:500; margin:8px 0 0;';
    totalLine.textContent = `총 무게: ${formatBothUnits(achievedTotalKg, baseUnitSelect.value)}`;
    plateResultEl.appendChild(totalLine);

    if(Math.abs(diffPerSideKg) > 0.05){
      const diffLine = document.createElement('p');
      diffLine.className = 'muted';
      diffLine.style.cssText = 'font-size:14px; margin:4px 0 0;';
      const directionText = diffPerSideKg > 0 ? '목표보다 살짝 부족해요' : '목표보다 살짝 초과했어요';
      diffLine.textContent = `${directionText} (한쪽당 차이: ${formatBothUnits(Math.abs(diffPerSideKg), baseUnitSelect.value)})`;
      plateResultEl.appendChild(diffLine);
    }
  }

  barSelect.onchange = renderPlateCalc;

  baseValueInput.oninput = ()=>{ renderSteps(); renderPlateCalc(); };
  baseUnitSelect.onchange = ()=>{ renderSteps(); renderPlateCalc(); };

  renderSteps();
  renderPlateCalc();
}

// 재사용 가능한 월별 캘린더 선택기. highlightedDates에 있는 날짜는 초록색으로 강조되고,
// allowAllDays가 true면 강조 안 된 날짜도 클릭 가능해요 (오늘 운동 탭 날짜 선택용).
function buildCalendarPicker({ highlightedDates, initialDate, selectedDate, onSelect, summaryLabel, allowAllDays }){
  const wrap = document.createElement('div');
  const highlightSet = new Set(highlightedDates || []);
  const ref = initialDate ? new Date(initialDate + 'T00:00:00') : new Date();
  let calYear = ref.getFullYear();
  let calMonth = ref.getMonth();
  let currentSelected = selectedDate || null;

  function pad2(n){ return n.toString().padStart(2, '0'); }

  function render(){
    wrap.innerHTML = '';
    const header = document.createElement('div');
    header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;';
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '←';
    prevBtn.style.cssText = 'width:32px; height:28px; padding:0; font-size:15px;';
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '→';
    nextBtn.style.cssText = 'width:32px; height:28px; padding:0; font-size:15px;';
    const monthLabel = document.createElement('span');
    monthLabel.style.cssText = 'font-size:16px; font-weight:500;';
    monthLabel.textContent = `${calYear}년 ${calMonth + 1}월`;
    header.appendChild(prevBtn);
    header.appendChild(monthLabel);
    header.appendChild(nextBtn);
    wrap.appendChild(header);

    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;';
    ['일','월','화','수','목','금','토'].forEach(d=>{
      const dEl = document.createElement('div');
      dEl.className = 'muted';
      dEl.style.cssText = 'text-align:center; font-size:13px; padding:2px 0;';
      dEl.textContent = d;
      grid.appendChild(dEl);
    });

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    for(let i = 0; i < firstDay; i++){
      grid.appendChild(document.createElement('div'));
    }

    const todayStrVal = todayStr();
    let highlightCount = 0;

    for(let day = 1; day <= daysInMonth; day++){
      const dateStr = `${calYear}-${pad2(calMonth + 1)}-${pad2(day)}`;
      const isHighlighted = highlightSet.has(dateStr);
      if(isHighlighted) highlightCount++;
      const clickable = allowAllDays || isHighlighted;

      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      if(clickable) cell.classList.add('clickable');
      if(isHighlighted) cell.classList.add('available');
      if(dateStr === todayStrVal) cell.classList.add('today');
      if(dateStr === currentSelected) cell.classList.add('selected');
      cell.textContent = day;
      if(clickable){
        cell.onclick = ()=>{
          currentSelected = dateStr;
          render();
          onSelect(dateStr);
        };
      }
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);

    if(summaryLabel){
      const summary = document.createElement('p');
      summary.className = 'muted';
      summary.style.cssText = 'font-size:14px; margin:8px 0 0;';
      summary.textContent = summaryLabel(highlightCount);
      wrap.appendChild(summary);
    }

    prevBtn.onclick = ()=>{
      calMonth--;
      if(calMonth < 0){ calMonth = 11; calYear--; }
      render();
    };
    nextBtn.onclick = ()=>{
      calMonth++;
      if(calMonth > 11){ calMonth = 0; calYear++; }
      render();
    };
  }
  render();

  return { el: wrap, setSelected(date){ currentSelected = date; render(); } };
}

function buildDateLookupBox(records, unit){
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:20px; box-shadow:var(--card-shadow);';

  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:8px;';
  const titleCol = document.createElement('div');
  const dateEyebrow = document.createElement('p');
  dateEyebrow.className = 'eyebrow';
  dateEyebrow.textContent = 'CALENDAR';
  titleCol.appendChild(dateEyebrow);
  const title = document.createElement('h3');
  title.style.cssText = 'font-size:18px; font-weight:500; margin:0;';
  title.textContent = '날짜별 기록 보기';
  titleCol.appendChild(title);
  titleRow.appendChild(titleCol);

  let dateEditMode = false;
  const editToggleBtn = document.createElement('button');
  editToggleBtn.type = 'button';
  editToggleBtn.title = '기록 수정하기';
  editToggleBtn.setAttribute('aria-label', '기록 수정하기');
  editToggleBtn.style.cssText = `width:32px; height:32px; flex-shrink:0; margin-top:2px; ${ICON_BTN_STYLE} border-radius:var(--radius);`;
  editToggleBtn.innerHTML = PENCIL_ICON_SVG;
  titleRow.appendChild(editToggleBtn);
  box.appendChild(titleRow);

  const resultEl = document.createElement('div');

  const uniqueDates = [...new Set(records.map(r=>r.date))].sort().reverse();
  let selectedDate = uniqueDates[0] || null;

  editToggleBtn.onclick = ()=>{
    dateEditMode = !dateEditMode;
    editToggleBtn.style.background = dateEditMode ? 'var(--text-primary)' : 'var(--surface-1)';
    editToggleBtn.style.color = dateEditMode ? 'var(--surface-0)' : 'var(--text-muted)';
    if(selectedDate) renderForDate(selectedDate);
  };

  // ---------- 훈련 캘린더 ----------
  const calendarPicker = buildCalendarPicker({
    highlightedDates: uniqueDates,
    initialDate: uniqueDates[0] || null,
    selectedDate,
    onSelect: (dateStr)=>{ selectedDate = dateStr; renderForDate(dateStr); },
    summaryLabel: (count)=> count > 0 ? `이 달에 ${count}일 훈련했어요` : '이 달에는 기록이 없어요'
  });
  calendarPicker.el.style.marginBottom = '16px';
  box.appendChild(calendarPicker.el);
  box.appendChild(resultEl);

  async function renderForDate(date){
    resultEl.innerHTML = '<p class="muted" style="font-size:15px;">불러오고 있어요...</p>';
    const dayRecords = records.filter(r=>r.date === date);
    if(dayRecords.length === 0){
      resultEl.innerHTML = '<p class="muted" style="font-size:15px;">이 날짜에는 기록이 없어요.</p>';
      return;
    }

    const { data: program } = await sb.from('programs').select('*').eq('date', date).single();

    // 프로그램에 등록된 순서(섹션/항목) 기준으로 정렬 기준을 만든다
    const itemOrder = [];
    if(program && program.items){
      program.items.forEach(it=>{
        if(it.type === 'barbell_conditioning' && it.movements){
          it.movements.forEach(m=> itemOrder.push({ key: `${it.name} - ${m}`, section: it.section }));
        } else if((it.type === 'amrap_by_round' || it.type === 'weight_by_round' || it.type === 'emom_by_round') && it.rounds){
          for(let r = 1; r <= parseInt(it.rounds); r++){
            itemOrder.push({ key: `${it.name} - ${r}R`, section: it.section });
          }
        } else {
          itemOrder.push({ key: it.name, section: it.section });
        }
      });
    }
    // 프로그램에는 없지만 기록에만 있는 항목(자유 추가된 동작명 등)은 발견 순서대로 뒤에 붙인다
    const seenKeys = new Set(itemOrder.map(io=>io.key));
    dayRecords.forEach(r=>{
      if(!seenKeys.has(r.item_name)){
        itemOrder.push({ key: r.item_name, section: r.section });
        seenKeys.add(r.item_name);
      }
    });

    const byItemName = {};
    dayRecords.forEach(r=>{
      if(!byItemName[r.item_name]) byItemName[r.item_name] = [];
      byItemName[r.item_name].push(r);
    });

    // 섹션 등장 순서(첫 등장 기준)를 뽑는다
    const sectionOrder = [];
    itemOrder.forEach(io=>{
      const sec = io.section || '기타';
      if(!sectionOrder.includes(sec)) sectionOrder.push(sec);
    });

    resultEl.innerHTML = '';
    sectionOrder.forEach(sectionName=>{
      const itemsInSection = itemOrder.filter(io => (io.section || '기타') === sectionName && byItemName[io.key] && byItemName[io.key].length > 0);
      if(itemsInSection.length === 0) return;

      const sectionBox = document.createElement('div');
      sectionBox.style.cssText = 'margin-bottom:12px;';
      const sTitle = document.createElement('p');
      sTitle.style.cssText = 'font-weight:500; font-size:16px; margin:0 0 6px;';
      sTitle.textContent = sectionName;
      sectionBox.appendChild(sTitle);

      itemsInSection.forEach(io=>{
        byItemName[io.key].forEach(r=>{
          const line = document.createElement('div');
          line.style.cssText = 'font-size:15px; margin:0 0 4px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;';

          const textSpan = document.createElement('span');
          if(r.skipped){
            textSpan.style.color = 'var(--text-muted)';
            textSpan.innerHTML = `${r.item_name} — 생략${r.scale_detail ? ' ('+r.scale_detail.replace('생략: ','')+')' : ''}`;
          } else {
            const detailTag = r.scaled ? `<div style="margin-top:4px;"><span class="tag scaled">※${r.scale_detail ? ' '+r.scale_detail : ''}</span></div>` : '';
            const displayValue = r.type === 'weight' ? formatWeight(parseFloat(r.value) || 0, unit) : r.value;
            textSpan.innerHTML = `${r.item_name} — <strong style="font-weight:500;">${displayValue}</strong>${detailTag}`;
          }

          line.appendChild(textSpan);

          if(dateEditMode){
            const editBtn = document.createElement('button');
            editBtn.textContent = '수정';
            editBtn.style.cssText = 'height:28px; font-size:14px; padding:0 10px; flex-shrink:0;';
            editBtn.onclick = ()=> startEditRecord(r, line, textSpan, unit, ()=> renderForDate(date), ()=>{
              const idx = records.indexOf(r);
              if(idx !== -1) records.splice(idx, 1);
              renderForDate(date);
            });

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '삭제';
            deleteBtn.className = 'danger';
            deleteBtn.style.cssText = 'height:28px; font-size:14px; padding:0 10px; flex-shrink:0;';
            deleteBtn.onclick = async ()=>{
              if(!confirm(`${r.item_name} 기록을 삭제할까요? 삭제하면 되돌릴 수 없어요.`)) return;
              const { error } = await sb.from('records').delete().eq('id', r.id);
              if(error){ alert('삭제에 실패했어요: ' + error.message); return; }
              const idx = records.indexOf(r);
              if(idx !== -1) records.splice(idx, 1);
              renderForDate(date);
            };

            const btnGroup = document.createElement('div');
            btnGroup.style.cssText = 'display:flex; gap:6px; flex-shrink:0;';
            btnGroup.appendChild(editBtn);
            btnGroup.appendChild(deleteBtn);
            line.appendChild(btnGroup);
          }

          sectionBox.appendChild(line);
        });
      });
      resultEl.appendChild(sectionBox);
    });
  }

  if(selectedDate){
    renderForDate(selectedDate);
  } else {
    resultEl.innerHTML = '<p class="muted" style="font-size:15px;">아직 기록이 없어요.</p>';
  }

  return box;
}

function filterProfileItemSections(query){
  const container = document.getElementById('profile-items-container');
  if(!container) return;
  const sections = container.querySelectorAll('[data-item-name]');
  sections.forEach(sec=>{
    const match = !query || sec.dataset.itemName.includes(query);
    sec.style.display = match ? '' : 'none';
  });
}

let keyLiftChartInstances = {};
async function toggleKeyLiftGraph(name, liftName, kIdx, unit, cardEl){
  const wrap = cardEl.querySelector('.key-lift-chart-wrap');
  const isHidden = wrap.classList.contains('hidden');
  if(!isHidden){
    wrap.classList.add('hidden');
    if(keyLiftChartInstances[kIdx]){ keyLiftChartInstances[kIdx].destroy(); delete keyLiftChartInstances[kIdx]; }
    return;
  }
  wrap.classList.remove('hidden');
  reveal(wrap);

  const { data, error } = await sb.from('key_lift_history')
    .select('*').eq('name', name).eq('lift_name', liftName)
    .order('recorded_date', { ascending: true });
  if(error || !data || data.length === 0){
    wrap.innerHTML = '<p class="muted" style="font-size:14px;">아직 이력이 없어요.</p>';
    return;
  }

  const canvas = document.getElementById(`key-lift-chart-${kIdx}`);
  if(!canvas) return;
  if(keyLiftChartInstances[kIdx]) keyLiftChartInstances[kIdx].destroy();

  const chartData = data.map(r=> Math.round(fromKg(r.value_kg, unit) * 10) / 10);
  const isPR = data.map((r,i)=> i === 0 || r.value_kg >= Math.max(...data.slice(0,i).map(d=>d.value_kg)));

  keyLiftChartInstances[kIdx] = buildGlassLineChart(canvas, {
    labels: data.map(r=>r.recorded_date),
    data: chartData,
    label: liftName,
    suffix: unit,
    highlights: isPR,
    tooltipLabel: (ctx)=> `${round1(ctx.parsed.y)}${unit}${isPR[ctx.dataIndex] ? '  · PR' : ''}`
  });
}

async function clearKeyLift(name, liftName, existing){
  if(!existing){ return; }
  if(!confirm(`${liftName} 기록과 이력을 모두 삭제할까요? 삭제하면 되돌릴 수 없어요.`)) return;
  await sb.from('key_lift_history').delete().eq('name', name).eq('lift_name', liftName);
  const { error } = await sb.from('key_lifts').delete().eq('name', name).eq('lift_name', liftName);
  if(error){ alert('삭제에 실패했어요: ' + error.message); return; }
  showProfileDetail(name);
}

async function saveKeyLiftValue(name, liftName, kgValue, recordedDate){
  const { error: histError } = await sb.from('key_lift_history').insert({
    name, lift_name: liftName, value_kg: kgValue, recorded_date: recordedDate
  });
  if(histError){ alert('이력 저장에 실패했어요: ' + histError.message); return false; }

  const { data: latestRow } = await sb.from('key_lift_history')
    .select('*').eq('name', name).eq('lift_name', liftName)
    .order('recorded_date', { ascending: false }).order('created_at', { ascending: false })
    .limit(1).maybeSingle();

  const latestValue = latestRow ? latestRow.value_kg : kgValue;
  const { error } = await sb.from('key_lifts').upsert({
    name, lift_name: liftName, value_kg: latestValue, updated_at: new Date().toISOString()
  }, { onConflict: 'name,lift_name' });
  if(error){ alert('저장에 실패했어요: ' + error.message); return false; }
  return true;
}

async function editKeyLift(name, liftName, existing, unit){
  const currentDisplay = existing ? fromKg(existing.value_kg, unit) : '';
  const input = prompt(`${liftName} 기록을 입력해주세요 (단위: ${unit})`, currentDisplay ? (Math.round(currentDisplay*10)/10).toString() : '');
  if(input === null) return;
  const num = parseFloat(input);
  if(isNaN(num)){ alert('숫자를 입력해주세요'); return; }
  const kgValue = Math.round(toKg(num, unit) * 100) / 100;

  const dateInput = prompt('이 기록의 날짜를 입력해주세요 (YYYY-MM-DD)', todayStr());
  if(dateInput === null) return;
  const recordedDate = dateInput.trim() || todayStr();

  const ok = await saveKeyLiftValue(name, liftName, kgValue, recordedDate);
  if(ok) showProfileDetail(name);
}

async function startEditRecord(record, lineEl, textSpan, unit, onSaved, onDeleted){
  const afterSave = onSaved || (()=> showProfileDetail(record.name));
  const afterDelete = onDeleted || afterSave;
  lineEl.innerHTML = '';
  const editForm = document.createElement('div');
  editForm.style.cssText = 'display:flex; gap:8px; align-items:center; flex-wrap:wrap; width:100%;';

  let valueInput, unitSelect;
  if(record.type === 'weight'){
    const currentDisplay = fromKg(parseFloat(record.value) || 0, unit);
    valueInput = document.createElement('input');
    valueInput.type = 'number'; valueInput.step = '0.1';
    valueInput.value = Math.round(currentDisplay * 10) / 10;
    valueInput.style.width = '100px';
    unitSelect = document.createElement('select');
    unitSelect.style.width = '70px';
    unitSelect.innerHTML = `<option value="lb" ${unit==='lb'?'selected':''}>lb</option><option value="kg" ${unit==='kg'?'selected':''}>kg</option>`;
    editForm.appendChild(valueInput);
    editForm.appendChild(unitSelect);
  } else {
    valueInput = document.createElement('input');
    valueInput.type = 'text';
    valueInput.value = record.value;
    valueInput.style.width = '160px';
    editForm.appendChild(valueInput);
  }

  const detailInput = document.createElement('input');
  detailInput.type = 'text';
  detailInput.placeholder = '세부기록 (선택)';
  detailInput.value = record.scale_detail || '';
  detailInput.style.cssText = 'width:100%; margin-top:6px;';
  editForm.appendChild(detailInput);

  const saveBtn = document.createElement('button');
  saveBtn.textContent = '저장';
  saveBtn.className = 'primary';
  saveBtn.style.cssText = 'height:32px; font-size:14px;';
  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '취소';
  cancelBtn.style.cssText = 'height:32px; font-size:14px;';
  const deleteBtn = document.createElement('button');
  deleteBtn.title = '삭제'; deleteBtn.setAttribute('aria-label', '삭제');
  deleteBtn.style.cssText = `width:32px; height:32px; ${ICON_BTN_DANGER_STYLE} border-radius:var(--radius); margin-left:auto;`;
  deleteBtn.innerHTML = TRASH_ICON_SVG;

  cancelBtn.onclick = ()=> afterSave();

  saveBtn.onclick = async ()=>{
    let newValue = valueInput.value.trim();
    if(!newValue){ alert('값을 입력해주세요'); return; }
    if(record.type === 'weight'){
      const u = unitSelect.value;
      newValue = (Math.round(toKg(parseFloat(newValue), u) * 100) / 100).toString();
    }
    const newDetail = detailInput.value.trim();
    const { error } = await sb.from('records').update({ value: newValue, scale_detail: newDetail, scaled: !!newDetail }).eq('id', record.id);
    if(error){ alert('수정에 실패했어요: ' + error.message); return; }
    record.value = newValue;
    record.scale_detail = newDetail;
    record.scaled = !!newDetail;
    afterSave();
  };

  deleteBtn.onclick = async ()=>{
    if(!confirm(`${record.item_name} 기록을 삭제할까요? 삭제하면 되돌릴 수 없어요.`)) return;
    const { error } = await sb.from('records').delete().eq('id', record.id);
    if(error){ alert('삭제에 실패했어요: ' + error.message); return; }
    afterDelete();
  };

  editForm.appendChild(saveBtn);
  editForm.appendChild(cancelBtn);
  editForm.appendChild(deleteBtn);
  lineEl.appendChild(editForm);
}

switchTab('log');
initFloatingWeightCalc();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
